<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B9BD5"/>
      <stop offset="0.55" stop-color="#A9D1EE"/>
      <stop offset="1" stop-color="#F6E7C8"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E8FA8"/>
      <stop offset="1" stop-color="#1F5E73"/>
    </linearGradient>
    <linearGradient id="farM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FA7BF"/>
      <stop offset="1" stop-color="#9FB6C9"/>
    </linearGradient>
    <linearGradient id="midM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C6F82"/>
      <stop offset="1" stop-color="#6E8494"/>
    </linearGradient>
    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DB35A"/>
      <stop offset="1" stop-color="#4E8A3A"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9C6A0"/>
      <stop offset="1" stop-color="#BFA77C"/>
    </linearGradient>
    <g id="pine">
      <rect x="-3" y="0" width="6" height="14" fill="#4a3324"/>
      <polygon points="0,-62 -16,-28 -9,-28 -22,4 22,4 9,-28 16,-28" />
    </g>
    <g id="wheel">
      <circle r="20" fill="#2B2320"/>
      <circle r="9" fill="#CFCFCF"/>
      <circle r="3" fill="#777"/>
    </g>
  </defs>

  <!-- sky + sun + clouds -->
  <rect width="1200" height="630" fill="url(#sky)"/>
  <circle cx="930" cy="120" r="56" fill="#FFE7A3" opacity=".95"/>
  <circle cx="930" cy="120" r="90" fill="#FFE7A3" opacity=".25"/>
  <g fill="#fff" opacity=".9">
    <ellipse cx="220" cy="110" rx="70" ry="20"/><ellipse cx="270" cy="96" rx="48" ry="22"/><ellipse cx="180" cy="100" rx="36" ry="16"/>
    <ellipse cx="640" cy="70" rx="58" ry="16"/><ellipse cx="680" cy="60" rx="38" ry="17"/>
  </g>

  <!-- far Tatra ridge -->
  <path d="M0 330 L70 290 L120 305 L190 230 L235 262 L300 175 L350 225 L395 205 L460 130 L520 210 L560 190 L615 240 L680 160 L730 215 L790 185 L850 245 L920 200 L990 255 L1060 215 L1130 260 L1200 240 L1200 400 L0 400 Z" fill="url(#farM)"/>
  <!-- snow caps -->
  <g fill="#F4F8FB">
    <path d="M460 130 L485 165 L472 160 L462 175 L450 158 L438 162 Z"/>
    <path d="M300 175 L322 205 L308 200 L298 214 L288 198 L280 203 Z"/>
    <path d="M680 160 L700 188 L688 184 L678 197 L668 183 L662 186 Z"/>
    <path d="M190 230 L205 250 L195 248 L188 258 L180 247 Z"/>
  </g>

  <!-- mid ridge -->
  <path d="M0 380 L90 330 L150 350 L230 290 L300 340 L370 300 L440 345 L520 285 L600 340 L700 300 L780 350 L860 310 L960 360 L1040 320 L1120 355 L1200 330 L1200 430 L0 430 Z" fill="url(#midM)"/>

  <!-- lake (Morskie Oko vibe) with reflection streaks -->
  <path d="M0 410 C200 395 420 400 640 405 C860 410 1040 398 1200 402 L1200 470 L0 470 Z" fill="url(#lake)"/>
  <g stroke="#BFE3EE" stroke-width="3" stroke-linecap="round" opacity=".55">
    <line x1="880" y1="425" x2="980" y2="425"/><line x1="900" y1="440" x2="960" y2="440"/>
    <line x1="160" y1="432" x2="250" y2="432"/><line x1="480" y1="450" x2="560" y2="450"/>
  </g>

  <!-- forest band -->
  <g fill="#2F5E3A">
    <use href="#pine" x="30" y="455" transform="scale(1)"/>
    <use href="#pine" x="70" y="462"/><use href="#pine" x="110" y="452"/><use href="#pine" x="1010" y="456"/>
    <use href="#pine" x="1050" y="448"/><use href="#pine" x="1090" y="460"/><use href="#pine" x="1130" y="450"/><use href="#pine" x="1175" y="458"/>
  </g>
  <g fill="#244B2F">
    <use href="#pine" x="0" y="0" transform="translate(150 470) scale(1.25)"/>
    <use href="#pine" x="0" y="0" transform="translate(960 472) scale(1.3)"/>
  </g>

  <!-- meadow -->
  <path d="M0 465 C250 450 500 470 760 458 C960 450 1100 462 1200 456 L1200 630 L0 630 Z" fill="url(#meadow)"/>
  <!-- flowers -->
  <g fill="#fff"><circle cx="90" cy="560" r="4"/><circle cx="130" cy="590" r="3.5"/><circle cx="1080" cy="575" r="4"/><circle cx="1120" cy="545" r="3.5"/><circle cx="60" cy="510" r="3"/></g>
  <g fill="#E8B83A"><circle cx="110" cy="575" r="3.5"/><circle cx="1100" cy="600" r="4"/><circle cx="1150" cy="560" r="3"/></g>
  <g fill="#C8102E"><circle cx="75" cy="600" r="3.5"/><circle cx="1060" cy="540" r="3"/></g>

  <!-- winding gravel road -->
  <path d="M640 630 C600 590 520 560 560 520 C590 492 700 482 760 470 L790 470 C740 486 640 500 625 525 C605 560 700 595 760 630 Z" fill="url(#road)"/>

  <!-- campervan 1 (red — רוזנבלום) -->
  <g transform="translate(250 455)">
    <ellipse cx="150" cy="118" rx="160" ry="12" fill="#000" opacity=".18"/>
    <path d="M10 30 Q10 0 40 0 L215 0 Q245 0 262 28 L292 70 Q300 82 300 96 L300 104 Q300 112 292 112 L18 112 Q10 112 10 104 Z" fill="#C8102E"/>
    <path d="M10 30 Q10 0 40 0 L215 0 Q245 0 262 28 L270 40 L10 40 Z" fill="#E63950"/>
    <rect x="10" y="74" width="290" height="10" fill="#8A0E22"/>
    <rect x="34" y="16" width="64" height="40" rx="7" fill="#DFF1FA" stroke="#fff" stroke-width="3"/>
    <rect x="112" y="16" width="64" height="40" rx="7" fill="#DFF1FA" stroke="#fff" stroke-width="3"/>
    <path d="M200 14 L238 14 Q250 14 258 30 L270 52 L200 52 Z" fill="#DFF1FA" stroke="#fff" stroke-width="3"/>
    <rect x="186" y="18" width="8" height="80" rx="2" fill="#8A0E22" opacity=".6"/>
    <rect x="44" y="-14" width="120" height="14" rx="4" fill="#F4F4F4"/>
    <circle cx="292" cy="92" r="6" fill="#FFE7A3"/>
    <use href="#wheel" x="70" y="112"/><use href="#wheel" x="238" y="112"/>
  </g>

  <!-- campervan 2 (cream/gold — אפרת) -->
  <g transform="translate(640 492) scale(.82)">
    <ellipse cx="150" cy="118" rx="160" ry="12" fill="#000" opacity=".18"/>
    <path d="M10 30 Q10 0 40 0 L215 0 Q245 0 262 28 L292 70 Q300 82 300 96 L300 104 Q300 112 292 112 L18 112 Q10 112 10 104 Z" fill="#FBF3E1"/>
    <rect x="10" y="64" width="290" height="22" fill="#C89B3C"/>
    <rect x="10" y="86" width="290" height="6" fill="#8f6d24"/>
    <rect x="34" y="16" width="64" height="38" rx="7" fill="#DFF1FA" stroke="#C89B3C" stroke-width="3"/>
    <rect x="112" y="16" width="64" height="38" rx="7" fill="#DFF1FA" stroke="#C89B3C" stroke-width="3"/>
    <path d="M200 14 L238 14 Q250 14 258 30 L270 52 L200 52 Z" fill="#DFF1FA" stroke="#C89B3C" stroke-width="3"/>
    <rect x="44" y="-14" width="120" height="14" rx="4" fill="#E9E1CF"/>
    <circle cx="292" cy="92" r="6" fill="#FFE7A3"/>
    <use href="#wheel" x="70" y="112"/><use href="#wheel" x="238" y="112"/>
  </g>

  <!-- foreground pines framing -->
  <g fill="#1E3F27">
    <use href="#pine" x="0" y="0" transform="translate(30 600) scale(2.1)"/>
    <use href="#pine" x="0" y="0" transform="translate(1165 610) scale(2.3)"/>
    <use href="#pine" x="0" y="0" transform="translate(1110 625) scale(1.6)"/>
  </g>
</svg>
