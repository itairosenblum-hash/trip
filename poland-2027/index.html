    if (isTrivia) initTrivia();
    if (id === "checklist") initChecklist();
    if (id === "forecast") initForecast();
  }

  renderWebcams(id);
  updateFunFacts(id);
  window.scrollTo({top:0, behavior:"smooth"});
}

try { initMap(); } catch(e) { console.error("map init failed", e); }
selectDay(TODAY_ID || "d1");

/* ---------- Site-wide search ----------
   Only one day's panel exists in the DOM at a time, so the index is built by rendering
   every day into a detached element (same trick as getRowTimes) the first time the search
   is opened. Each entry remembers {day, selector, index-within-selector}, so a result can
   be re-found in the live panel after selectDay() re-renders it. The rendered string must
   match what selectDay() builds, or the indexes would point at the wrong element. */
const SEARCH_SECTIONS = [
  {sel:".tag",                       kind:"תאריך וכותרת"},
  {sel:"h2.title",                   kind:"כותרת היום"},
  {sel:"table.sched td:first-child", kind:"לו״ז"},
  {sel:".places .p",                 kind:"מה יש שם"},
  {sel:".box",                       kind:"מידע"},
  {sel:".tollBox li",                kind:"עלויות דרך"},
  {sel:".eat .body",                 kind:"מסעדה"},
  {sel:"table.kids td:first-child",  kind:"פרטים"},
  {sel:"ul.altlist li",              kind:"חלופה"},
  {sel:"ol.checklist li",            kind:"בדיקות לפני הנסיעה"},
];
// Pages built by their own JS (checklist state, live forecast, quiz) aren't indexable from
// a detached render, so they stay out.
const SEARCH_SKIP_DAYS = ["trivia", "forecast", "checklist", "costs"];   // "van" is static, so it stays searchable

// Hebrew transliterations, so "הלשטט" finds Hallstatt and "vienna" finds וינה.
const SEARCH_SYNONYMS = [
  ["krakow","קרקוב"], ["kraków","קרקוב"], ["wieliczka","וליצ׳קה ווליצקה מכרה"], ["wawel","ואוול וואוול"],
  ["energylandia","אנרג׳ילנדיה אנרגילנדיה"], ["zator","זאטור"], ["zatorland","זאטורלנד דינוזאורים"],
  ["niedzica","ניידז׳יצה נידזיצה"], ["czorsztyn","צ׳ורשטין"], ["dunajec","דונאיץ רפטינג רפסודות"],
  ["szczawnica","שצ׳בניצה"], ["bania","בניה בריכות"], ["białka","ביאלקה"], ["zakopane","זקופנה"],
  ["gubałówka","גובאלובקה"], ["krupówki","קרופובקי"], ["morskie oko","מורסקיה אוקו"],
  ["kazimierz","קז׳ימייז׳ קזימייז"], ["ojców","אויצוב"], ["pieskowa","פייסקובה"],
  ["termy","טרמה בריכות חמות"], ["camping","קמפינג"], ["waze","וייז"],
];

function normText(s){
  return (s||"")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/ß/g,"ss")
    .toLowerCase()
    .replace(/[״׳'"`]/g,"")
    .replace(/\s+/g," ")
    .trim();
}
function synonymExtra(hay){
  let extra = "";
  SEARCH_SYNONYMS.forEach(([lat, heb]) => {
    if (hay.includes(lat)) extra += " " + heb;
    else if (heb.split(" ").some(w => hay.includes(w))) extra += " " + lat;
  });
  return extra;
}
function escHtml(s){
  return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

let SEARCH_INDEX = null;
function buildSearchIndex(){
  if (SEARCH_INDEX) return SEARCH_INDEX;
  const idx = [];
  const tmp = document.createElement("div");
  DAYS.forEach(day => {
    if (SEARCH_SKIP_DAYS.includes(day.id)) return;
    tmp.innerHTML = day.render() + renderToll(day.id) + renderEats(day.id);
    SEARCH_SECTIONS.forEach(sec => {
      tmp.querySelectorAll(sec.sel).forEach((el, i) => {
        const text = el.textContent.replace(/\s+/g," ").trim();
        if (text.length < 3) return;
        const base = normText(text);
        idx.push({dayId:day.id, sel:sec.sel, i, kind:sec.kind, text,
                  hay: base + " " + normText(sec.kind) + synonymExtra(base)});
      });
    });
  });
  Object.keys(LOC).forEach(k => {
    const loc = LOC[k];
    const text = loc.label + (loc.address ? " — " + loc.address : "");
    const base = normText(text);
    idx.push({place:k, kind:"מקום", text, hay: base + synonymExtra(base)});
  });
  SEARCH_INDEX = idx;
  return idx;
}

function runSearch(q){
  const nq = normText(q);
  if (nq.length < 2) return null;
  const tokens = nq.split(" ").filter(Boolean);
  const out = [];
  buildSearchIndex().forEach(e => {
    if (!tokens.every(t => e.hay.includes(t))) return;
    let score = e.hay.indexOf(tokens[0]);
    if (e.place) score -= 400;
    if (e.sel === "h2.title" || e.sel === ".tag") score -= 300;
    if (e.kind === "לו״ז") score -= 60;
    out.push({e, score});
  });
  out.sort((a,b) => a.score - b.score);
  return out;
}

// Highlights the matched term inside a trimmed excerpt, so long info boxes stay scannable.
function markSnippet(text, rawToken){
  const MAX = 140;
  const i = rawToken ? text.toLowerCase().indexOf(rawToken.toLowerCase()) : -1;
  const start = i > 60 ? i - 50 : 0;
  const piece = text.slice(start, start + MAX);
  const pre = start > 0 ? "…" : "";
  const post = (start + MAX) < text.length ? "…" : "";
  const rel = i - start;
  if (i >= 0 && rel >= 0 && rel + rawToken.length <= piece.length){
    return pre + escHtml(piece.slice(0, rel)) +
           "<mark>" + escHtml(piece.slice(rel, rel + rawToken.length)) + "</mark>" +
           escHtml(piece.slice(rel + rawToken.length)) + post;
  }
  return pre + escHtml(piece) + post;
}

function renderSearchResults(q){
  const box = document.getElementById("searchResults");
  const results = runSearch(q);
  if (results === null){
    box.innerHTML = `<div class="searchHint">הקלידו שתי אותיות ומעלה. אפשר לחפש שם מקום (זקופנה, מכרה מלח, קמפינג), מסעדה, שם מלון, שעה מהלו״ז או כל טקסט מהאתר.</div>`;
    return;
  }
  if (!results.length){
    box.innerHTML = `<div class="searchEmpty">אין תוצאות ל"${escHtml(q.trim())}". נסו מילה אחת קצרה יותר.</div>`;
    return;
  }
  const token = q.trim().split(/\s+/)[0];
  const places = results.filter(r => r.e.place).slice(0, 6);
  const byDay = {};
  results.filter(r => !r.e.place).forEach(r => {
    (byDay[r.e.dayId] = byDay[r.e.dayId] || []).push(r);
  });

  let html = "";
  if (places.length){
    html += `<div class="searchGroup"><h3 class="searchGroupHead">📍 מקומות וניווט</h3>` +
      places.map(r => `<div class="searchPlaceRow">
        <span class="nm">${LOC_ICON[r.e.place] || "📍"} ${markSnippet(r.e.text, token)}</span>
        <a class="rowWaze" href="${wazeLink(r.e.place)}" target="_blank" rel="noopener" title="נווט ב-Waze">🧭</a>
      </div>`).join("") + `</div>`;
  }
  DAYS.forEach(d => {
    const list = byDay[d.id];
    if (!list) return;
    html += `<div class="searchGroup"><h3 class="searchGroupHead">${DAY_ICON[d.id] || "📍"} ${d.nav} · ${d.navSub}</h3>` +
      list.slice(0, 8).map(r => `<button type="button" class="searchItem"
        data-day="${d.id}" data-sel="${escHtml(r.e.sel)}" data-i="${r.e.i}">
        <span class="kind">${r.e.kind}</span>${markSnippet(r.e.text, token)}</button>`).join("") + `</div>`;
  });
  box.innerHTML = html;
}

function openSearch(){
  const sheet = document.getElementById("searchSheet");
  const input = document.getElementById("searchInput");
  if (!sheet || !input) return;
  sheet.hidden = false;
  document.body.classList.add("searchOpen");
  renderSearchResults(input.value);
  setTimeout(() => input.focus(), 60);
}
function closeSearch(){
  const sheet = document.getElementById("searchSheet");
  if (!sheet) return;
  sheet.hidden = true;
  document.body.classList.remove("searchOpen");
}

// Re-finds the matched element in the freshly rendered panel and flashes it.
function jumpToResult(dayId, sel, i){
  closeSearch();
  selectDay(dayId);
  setTimeout(() => {
    const el = panelEl.querySelectorAll(sel)[Number(i)];
    if (!el) return;
    const target = el.closest("tr") || el;
    target.classList.add("searchHit");
    target.scrollIntoView({behavior:"smooth", block:"center"});
    setTimeout(() => target.classList.remove("searchHit"), 2400);
  }, 240);
}

(function initSearch(){
  const input = document.getElementById("searchInput");
  let debounce = null;
  input?.addEventListener("input", () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => renderSearchResults(input.value), 120);
  });
  input?.addEventListener("keydown", e => { if (e.key === "Escape") closeSearch(); });
  document.getElementById("searchClose")?.addEventListener("click", closeSearch);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSearch(); });
  document.getElementById("searchResults")?.addEventListener("click", e => {
    const btn = e.target.closest(".searchItem");
    if (!btn) return;
    jumpToResult(btn.dataset.day, btn.dataset.sel, btn.dataset.i);
  });
})();

/* ---------- PWA auto-refresh: every time the app is opened/foregrounded, actively
   check for a newer version and, if one takes over, reload automatically so the
   visitor never has to manually clear the cache. ---------- */
if ("serviceWorker" in navigator){
  // Only auto-reload on a REAL update (a newer service worker replacing one that was
  // already controlling this page) — not on the very first install, where the first
  // "controllerchange" just means the page has a controller for the first time.
  let hadController = !!navigator.serviceWorker.controller;

  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((reg) => {
      // Re-check for a new version every time the app is opened or comes back to the foreground.
      reg.update().catch(()=>{});
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") reg.update().catch(()=>{});
      });
    }).catch(()=>{});
  });

  let swRefreshed = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController){ hadController = true; return; }
    if (swRefreshed) return;
    swRefreshed = true;
    window.location.reload();
  });
}

/* ---------- Install prompt: proactively offer to install the app, instead of
   relying on the visitor to find the option in the browser menu themselves. ---------- */
(function(){
  const DISMISS_KEY = "poland2027_install_dismissed_v1";
  const banner = document.getElementById("installBanner");
  const textEl = document.getElementById("installBannerText");
  const btnEl = document.getElementById("installBannerBtn");
  const closeEl = document.getElementById("installBannerClose");
  let deferredPrompt = null;

  function isStandalone(){
    return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  }
  function isIOS(){
    const ua = window.navigator.userAgent;
    const iOSDevice = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    const iPadOS13Plus = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
    return iOSDevice || iPadOS13Plus;
  }
  function dismissed(){
    try { return localStorage.getItem(DISMISS_KEY) === "1"; } catch(e){ return false; }
  }

  function show(mode){
    if (!banner || isStandalone() || dismissed()) return;
    if (mode === "ios"){
      textEl.textContent = "התקינו את האתר כאפליקציה: הקישו שיתוף ⬆️ ואז \"הוסף למסך הבית\"";
      btnEl.hidden = true;
    } else {
      textEl.textContent = "התקינו את האתר כאפליקציה למסך הבית — גישה מהירה גם בלי אינטרנט";
      btnEl.hidden = false;
    }
    banner.hidden = false;
  }
  function hide(){
    if (banner) banner.hidden = true;
  }

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    show("android");
  });

  window.addEventListener("appinstalled", () => {
    hide();
    try { localStorage.setItem(DISMISS_KEY, "1"); } catch(e){}
  });

  btnEl && btnEl.addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    try { await deferredPrompt.userChoice; } catch(e){}
    deferredPrompt = null;
    hide();
  });

  closeEl && closeEl.addEventListener("click", () => {
    hide();
    try { localStorage.setItem(DISMISS_KEY, "1"); } catch(e){}
  });

  if (isIOS() && !isStandalone() && !dismissed()){
    setTimeout(() => show("ios"), 1500);
  }
})();
</script>
