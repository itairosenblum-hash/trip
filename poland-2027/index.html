<style>
  :root{
    --red:#C8102E;
    --red-dark:#8A0E22;
    --red-pop:#E63950;
    --red-soft:#FBEAEC;
    --gold:#C89B3C;
    --gold-dark:#8f6d24;
    --gold-soft:#FBF3E1;
    --cream:#FFFFFF;
    --cream-2:#FBEEEF;
    --ink:#2B2320;
    --muted:#78706c;
    --line:#EFE1E1;
    --red-bg:#FBEAEC;
    --green-bg:#EFF6EC;
    --green-txt:#3d7a3f;
    --yellow-bg:#FDF6E3;
    --radius-lg:20px;
    --radius-md:14px;
    --shadow-soft:0 4px 16px rgba(43,35,32,.09);
    --shadow-pop:0 6px 20px rgba(43,35,32,.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Heebo',sans-serif;
    font-weight:400;
    line-height:1.6;
    font-size:15.5px;
  }
  h1,h2,h3{font-family:'Frank Ruhl Libre',serif;margin:0;}
  header.top{
    position:relative;
    padding:26px 28px 22px;
    background:
      radial-gradient(circle at 92% -10%, rgba(200,16,46,.10), transparent 55%),
      radial-gradient(circle at 6% 120%, rgba(200,155,60,.14), transparent 50%),
      linear-gradient(180deg,#fff, #FFFAF9);
    border-bottom:3px solid var(--red);
  }
  header.top .allTrips{display:inline-block;margin-bottom:8px;font-size:13px;font-weight:700;color:var(--red-dark);text-decoration:none;background:var(--red-soft);padding:4px 12px;border-radius:999px;}
  header.top .eyebrow{color:var(--red);font-size:14px;font-weight:700;margin-bottom:4px;letter-spacing:.2px;}
  header.top h1{font-size:32px;color:var(--red-dark);font-weight:700;}
  header.top .sub{color:var(--muted);font-size:14.5px;margin-top:6px;}
  .countdown{
    display:inline-block;margin-top:10px;
    background:var(--gold-soft);color:var(--gold-dark);
    font-weight:700;font-size:13px;
    padding:6px 14px;border-radius:999px;border:1px solid var(--gold);
  }
  .countdown[hidden]{display:none;}

  .layout{
    display:flex;
    flex-direction:column;
    max-width:1280px;
    margin:0 auto;
    padding:22px 28px 96px;
    gap:26px;
  }

  /* ---------- Nav: row 1 = overview/info/trivia pills, row 2 = horizontal day scroller ----------
     Pinned to the top of the viewport at all times (position:sticky). The ::after strip is a
     thin gold fade-line, and the box-shadow gives it a subtle "floating shelf" look, so content
     scrolling underneath has a clean, deliberate edge instead of an abrupt flat cutoff. */
  nav.daynav{
    position:sticky;
    top:0;
    z-index:1500;
    background:var(--cream);
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:8px 0 12px;
    box-shadow:0 12px 14px -12px rgba(43,35,32,.20);
  }
  nav.daynav::after{
    content:"";
    position:absolute;
    left:0;right:0;bottom:0;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity:.75;
  }
  nav.daynav button{
    all:unset;
    cursor:pointer;
    color:var(--ink);
    display:flex;
    align-items:center;
    position:relative;
    border:2px solid transparent;
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }
  nav.daynav button .icon{font-size:18px;line-height:1;flex:0 0 auto;}
  nav.daynav button .label{display:flex;flex-direction:column;gap:1px;min-width:0;}
  nav.daynav button .wd{color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.2px;}
  nav.daynav button.active .wd{color:rgba(255,255,255,.8);}
  nav.daynav button .d{font-weight:700;color:var(--red-dark);font-size:13.5px;}
  nav.daynav button .t{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  nav.daynav button:active{transform:scale(.97);}
  nav.daynav button.active{background:var(--red-dark);border-color:var(--gold);box-shadow:var(--shadow-pop);}
  nav.daynav button.active .d,nav.daynav button.active .t{color:#fff;}
  nav.daynav button.isToday:not(.active){border-color:var(--gold);}
  nav.daynav button .todayDot{
    position:absolute;top:-6px;inset-inline-end:-4px;
    background:var(--gold);color:#fff;font-size:9px;font-weight:800;
    padding:1px 6px;border-radius:999px;letter-spacing:.3px;
  }

  /* ---------- Bottom tab bar: the four reference pages (overview / info / costs / trivia).
     Fixed to the bottom of the viewport so it sits in thumb reach and leaves the top of the
     screen to the day strip and the content. Sits below the fullscreen map (z-index 3000)
     so expanding the map still covers everything. ---------- */
  .tabbar{
    position:fixed;
    left:0;right:0;bottom:0;
    z-index:1400;
    display:flex;
    background:rgba(255,255,255,.97);
    backdrop-filter:saturate(180%) blur(8px);
    border-top:1px solid var(--line);
    box-shadow:0 -6px 16px -8px rgba(43,35,32,.28);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar button{
    all:unset;
    flex:1;
    cursor:pointer;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    padding:9px 2px 10px;
    color:var(--muted);
    font-size:11px;
    font-weight:700;
    text-align:center;
    transition:color .15s ease;
  }
  .tabbar button .icon{font-size:19px;line-height:1;transition:transform .15s ease;}
  .tabbar button .t{display:none;}
  .tabbar button:active{transform:scale(.96);}
  .tabbar button.active{color:var(--red-dark);}
  .tabbar button.active .icon{transform:translateY(-1px) scale(1.08);}
  .tabbar button.active::before{
    content:"";
    position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:28px;height:3px;
    border-radius:0 0 3px 3px;
    background:var(--gold);
  }

  .dayScrollWrap{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .dayScrollArrow{
    all:unset;
    flex:0 0 auto;
    cursor:pointer;
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:#fff;border:1px solid var(--line);color:var(--red-dark);
    font-size:16px;font-weight:800;line-height:1;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
    transition:transform .12s ease;
  }
  .dayScrollArrow:hover{transform:scale(1.08);}
  .dayScrollArrow:active{transform:scale(.92);}
  .dayScroll{
    flex:1;
    min-width:0;
    display:flex;
    gap:8px;
    overflow-x:auto;
    scroll-behavior:smooth;
    scroll-snap-type:x proximity;
    padding:2px 2px 8px;
    scrollbar-width:none;
  }
  .dayScroll::-webkit-scrollbar{display:none;}
  .dayScroll button{
    flex:0 0 auto;
    scroll-snap-align:center;
    flex-direction:column;
    justify-content:center;
    text-align:center;
    gap:3px;
    min-width:70px;
    padding:9px 8px;
    border-radius:14px;
    border:2px solid var(--line);
    background:#fff;
  }
  .dayScroll button:hover{background:var(--cream-2);}
  .dayScroll button .label{align-items:center;}
  .dayScroll button .t{white-space:normal;line-height:1.2;max-width:70px;}

  main.content{flex:1;min-width:0;}

  .nowBar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:linear-gradient(135deg, var(--gold-dark), var(--gold));
    color:#fff;border-radius:var(--radius-lg);
    padding:14px 18px;margin-bottom:16px;
    box-shadow:var(--shadow-pop);
  }
  .nowBar[hidden]{display:none;}
  .nowBar-text{display:flex;flex-direction:column;gap:2px;}
  .nowBar-label{font-size:12px;font-weight:700;opacity:.9;letter-spacing:.2px;}
  .nowBar-place{font-size:18px;font-weight:800;font-family:'Frank Ruhl Libre',serif;}
  .nowBar-btn{
    background:#fff;color:var(--gold-dark);text-decoration:none;
    font-weight:800;font-size:14.5px;padding:11px 20px;border-radius:999px;
    white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.15);
    transition:transform .12s ease;
  }
  .nowBar-btn:hover{transform:translateY(-1px) scale(1.02);}

  .installBanner{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:linear-gradient(135deg, var(--red-dark), var(--red));
    color:#fff;padding:10px 24px;font-size:14px;
  }
  .installBanner[hidden]{display:none;}
  .installBanner-icon{font-size:19px;line-height:1;}
  .installBanner-text{flex:1;min-width:200px;}
  .installBanner-btn{
    background:#fff;color:var(--red-dark);border:none;font-weight:800;
    padding:8px 18px;border-radius:999px;cursor:pointer;font-size:13.5px;
    white-space:nowrap;transition:transform .12s ease;
  }
  .installBanner-btn:hover{transform:scale(1.04);}
  .installBanner-btn[hidden]{display:none;}
  .installBanner-close{
    background:transparent;border:none;color:#fff;font-size:16px;cursor:pointer;
    opacity:.85;padding:4px 6px;line-height:1;
  }
  .installBanner-close:hover{opacity:1;}

  .weatherCard{
    display:block;
    background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);
    padding:12px 16px;margin-bottom:20px;box-shadow:var(--shadow-soft);
    font-size:14px;
  }
  .weatherCard[hidden]{display:none;}
  .wxTop{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  /* Hourly strip. The hours the day's schedule actually covers are tinted gold, so the
     forecast reads against the plan rather than as a standalone weather widget. */
  .wxHours{
    display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;
    padding:10px 0 2px;margin-top:9px;border-top:1px solid #F6EDED;
  }
  .wxHours::-webkit-scrollbar{display:none;}
  .wxHour{flex:0 0 auto;width:50px;text-align:center;padding:5px 2px;border-radius:10px;}
  .wxHour.out{background:var(--gold-soft);}
  .wxHour .hr{font-size:11px;color:var(--muted);font-weight:700;}
  .wxHour .ic{font-size:16px;line-height:1.3;}
  .wxHour .tp{font-size:13.5px;font-weight:800;color:var(--red-dark);}
  .wxHour .rn{font-size:10.5px;color:#3d7a9e;font-weight:600;}
  .wxHour .rn.wet{color:var(--red);font-weight:800;}
  .wxNote{font-size:11px;color:var(--muted);margin-top:7px;}
  .weatherIcon{font-size:26px;line-height:1;}
  .weatherTemps{font-weight:700;color:var(--ink);}
  .weatherTemps b{color:var(--red-dark);font-size:16.5px;}
  .weatherRain{color:#3d7a9e;font-weight:600;}
  .weatherLoc{margin-inline-start:auto;color:var(--muted);font-size:12.5px;}
  .weatherLoading,.weatherNA{color:var(--muted);font-size:13px;}

  /* ---------- "Did you know?" carousel, shown per trip day ---------- */
  .funFactCard{
    background:linear-gradient(135deg, #eaf4fb, #f7f0ff);
    border:1px solid #dfe7f5;border-radius:var(--radius-md);
    padding:14px 16px 12px;margin-bottom:20px;box-shadow:var(--shadow-soft);
    text-align:center;
  }
  .funFactCard[hidden]{display:none;}
  .funFact-head{font-weight:800;color:#4a5fb0;font-size:13.5px;margin-bottom:6px;}
  .funFact-body{display:flex;align-items:center;gap:10px;}
  .funFactText{
    flex:1;margin:0;font-size:14.5px;color:var(--ink);line-height:1.55;
    min-height:1.6em;
  }
  .funFactArrow{
    flex:0 0 auto;width:32px;height:32px;border-radius:50%;
    border:none;background:#fff;color:#4a5fb0;font-size:19px;font-weight:800;
    cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.1);
    display:flex;align-items:center;justify-content:center;line-height:1;
    transition:transform .12s ease;
  }
  .funFactArrow:hover{transform:scale(1.1);}
  .funFactArrow:active{transform:scale(.92);}
  .funFactDots{display:flex;justify-content:center;gap:6px;margin-top:10px;}
  .funFactDots span{
    width:6px;height:6px;border-radius:50%;background:#c8d2ea;transition:.2s;
  }
  .funFactDots span.on{background:#4a5fb0;width:16px;border-radius:4px;}

  /* ---------- Trivia game page — brighter, bigger, kid-facing ---------- */
  .tabbar button#nav-trivia{overflow:visible;}
  .tabbar button#nav-trivia .icon{
    animation:kidBounce 2.2s ease-in-out infinite;
  }
  @keyframes kidBounce{
    0%,100%{transform:translateY(0) rotate(0deg);}
    25%{transform:translateY(-3px) rotate(-6deg);}
    75%{transform:translateY(-1px) rotate(6deg);}
  }
  .kidTag{color:#7a3fc9 !important;}
  .kidTitle{
    background:linear-gradient(90deg, var(--red), #7a3fc9, var(--gold-dark));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-size:26px !important;
  }
  .quizIntro{font-size:15px;color:var(--muted);margin:6px 0 18px;}
  .quizRoot{max-width:640px;}
  .quizCard{
    background:#fff;border:2px solid var(--gold);border-radius:22px;
    padding:22px 20px;box-shadow:var(--shadow-pop);
  }
  .quizProgress{
    display:flex;justify-content:space-between;align-items:center;
    font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:12px;
  }
  .quizScore{color:var(--gold-dark);}
  .quizQuestion{
    font-family:'Frank Ruhl Libre',serif;font-size:19px;font-weight:700;
    color:var(--red-dark);margin:0 0 18px;line-height:1.4;
  }
  .quizOptions{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .quizOption{
    background:var(--gold-soft);border:2px solid transparent;border-radius:14px;
    padding:15px 12px;font-size:15px;font-weight:700;color:var(--ink);
    cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;
    font-family:inherit;text-align:center;
  }
  .quizOption:hover{transform:scale(1.03);box-shadow:var(--shadow-soft);}
  .quizOption.correct{background:var(--green-bg);border-color:#3d7a3f;color:#2c5c2e;}
  .quizOption.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red-dark);}
  .quizOption.disabled{pointer-events:none;opacity:.9;}
  .quizOption.disabled:not(.correct):not(.wrong){opacity:.55;}
  .quizFeedback{margin-top:16px;font-size:16px;font-weight:800;text-align:center;}
  .quizFeedback.correct{color:#2c5c2e;}
  .quizFeedback.wrong{color:var(--red-dark);}
  .quizFact{
    margin-top:10px;background:var(--gold-soft);border-radius:12px;
    padding:12px 14px;font-size:13.5px;color:var(--ink);text-align:center;
  }
  .quizNextBtn{
    display:block;margin:18px auto 0;background:var(--red-dark);color:#fff;
    border:none;padding:12px 30px;border-radius:999px;font-weight:800;
    font-size:15px;cursor:pointer;font-family:inherit;
    transition:transform .12s ease;
  }
  .quizNextBtn:hover{transform:scale(1.04);}
  .quizSummary{text-align:center;padding:10px 6px;}
  .quizSummary .emoji{font-size:52px;line-height:1;margin-bottom:10px;}
  .quizSummary .scoreLine{
    font-family:'Frank Ruhl Libre',serif;font-size:24px;font-weight:800;
    color:var(--red-dark);margin-bottom:8px;
  }
  .quizSummary .msg{font-size:15px;color:var(--ink);margin-bottom:20px;}
  .quizAgainBtn{
    background:linear-gradient(135deg, var(--red-dark), var(--red));color:#fff;
    border:none;padding:13px 32px;border-radius:999px;font-weight:800;
    font-size:15.5px;cursor:pointer;font-family:inherit;
    box-shadow:var(--shadow-pop);transition:transform .12s ease;
  }
  .quizAgainBtn:hover{transform:scale(1.05);}

  /* Sits as the last item in the tab bar. Keeps the WhatsApp green so it reads as an
     outbound link rather than another page of the site. */
  .waFab{
    flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    padding:9px 2px 10px;
    text-decoration:none;
    color:#128C4A;font-size:11px;font-weight:700;
    transition:transform .12s ease;
  }
  .waFab:active{transform:scale(.96);}
  .waFab svg{width:19px;height:19px;fill:#25D366;display:block;}

  .mapCard{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:16px 16px 14px;
    margin-bottom:20px;
    box-shadow:var(--shadow-soft);
  }
  .mapCard .mapTitle{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:6px;
  }
  .mapCard .mapTitle h2{font-size:17px;color:var(--red-dark);}
  .mapCard .mapTitle span{font-size:12.5px;color:var(--muted);}
  .mapWrap{position:relative;}
  #mapDiv{
    width:100%;
    height:340px;
    border-radius:var(--radius-md);
    overflow:hidden;
    direction:ltr;
    background:var(--cream-2);
  }
  .mapControls{
    position:absolute;top:10px;right:10px;z-index:1000;
    display:flex;flex-direction:column;gap:6px;
  }
  .mapCtrlBtn{
    width:34px;height:34px;border-radius:8px;
    border:1px solid var(--line);background:#fff;
    box-shadow:0 2px 6px rgba(0,0,0,.18);
    font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease;
  }
  .mapCtrlBtn:hover{transform:scale(1.07);}
  .mapCtrlBtn:active{transform:scale(.95);}
  .mapRouteInfo{
    margin-top:8px;font-size:12.5px;color:var(--muted);
    display:flex;gap:16px;flex-wrap:wrap;
  }
  .mapRouteInfo[hidden]{display:none;}
  .mapRouteInfo b{color:var(--red-dark);}
  .mapCard.fullscreen{
    position:fixed;inset:0;z-index:3000;
    margin:0;border-radius:0;
    height:100vh;display:flex;flex-direction:column;
    padding:14px;
  }
  .mapCard.fullscreen .mapWrap{flex:1;min-height:0;}
  .mapCard.fullscreen #mapDiv{height:100%;}
  body.mapFsOpen{overflow:hidden;}
  .map-marker{
    width:12px;height:12px;border-radius:50%;
    background:#cbb9ba;border:2px solid #fff;
    box-shadow:0 1px 3px rgba(0,0,0,.35);
    transition:all .15s ease;
  }
  .map-marker.active{
    width:17px;height:17px;
    background:var(--red);
    margin:-2.5px 0 0 -2.5px;
  }
  .map-marker.base{
    width:0;height:0;
    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-bottom:14px solid var(--red-dark);
    background:none;border-width:0;box-shadow:none;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));
  }
  .map-num{
    width:24px;height:24px;border-radius:50%;
    background:var(--red);color:#fff;border:2px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,.4);
    font:800 12px/20px 'Heebo',sans-serif;text-align:center;box-sizing:border-box;
  }
  .map-num.home{background:var(--red-dark);font-size:13px;line-height:19px;}
  .map-num.day{background:var(--gold-dark);}
  .leaflet-tooltip.map-tooltip{
    direction:ltr;text-align:left;
    font-family:'Heebo',sans-serif;
    font-size:12px;
    color:var(--ink);
    background:#fff;
    border:1px solid var(--line);
    box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  .leaflet-tooltip.map-tooltip.base-tooltip{font-weight:700;color:var(--red-dark);}
  .leaflet-tooltip.map-tooltip.active-tooltip{font-weight:700;color:var(--red-dark);}

  .rowWaze{
    display:inline-flex;align-items:center;justify-content:center;
    width:24px;height:24px;margin-inline-start:8px;
    border-radius:50%;background:var(--gold-soft);
    font-size:13px;text-decoration:none;vertical-align:middle;line-height:1;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .rowWaze:hover{box-shadow:var(--shadow-soft);transform:scale(1.12);}

  /* Traffic-congestion badge: same pill shape as the Waze button so schedule rows stay
     visually even, but tinted red so a jam warning reads differently from a nav action.
     It's a <button> (not a link) — tapping toggles the detail line underneath the row. */
  .rowTraffic{
    display:inline-flex;align-items:center;justify-content:center;
    width:24px;height:24px;margin-inline-start:6px;padding:0;
    border:none;border-radius:50%;background:var(--red-soft);
    font-size:13px;line-height:1;vertical-align:middle;cursor:pointer;
    font-family:inherit;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .rowTraffic:hover{box-shadow:var(--shadow-soft);transform:scale(1.12);}
  .rowTraffic[aria-expanded="true"]{background:var(--red);}
  .trafficNote{
    margin-top:6px;font-size:12.8px;line-height:1.5;
    color:var(--red-dark);background:var(--red-soft);
    border-radius:10px;padding:8px 11px;text-align:start;
  }
  .trafficNote[hidden]{display:none;}
  .trafficNote b{font-weight:800;}
  /* Toll / parking-cost badge: same pill as the Waze and traffic buttons, tinted gold so
     "this costs money" reads differently from "this is a jam" and from "navigate here". */
  .rowToll{
    display:inline-flex;align-items:center;justify-content:center;
    width:24px;height:24px;margin-inline-start:6px;padding:0;
    border:none;border-radius:50%;background:var(--gold-soft);
    font-size:13px;line-height:1;vertical-align:middle;cursor:pointer;
    font-family:inherit;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .rowToll:hover{box-shadow:var(--shadow-soft);transform:scale(1.12);}
  .rowToll[aria-expanded="true"]{background:var(--gold);}
  .tollNote{
    margin-top:6px;font-size:12.8px;line-height:1.5;
    color:var(--gold-dark);background:var(--gold-soft);
    border-radius:10px;padding:8px 11px;text-align:start;
  }
  .tollNote[hidden]{display:none;}
  .tollNote b{font-weight:800;}
  .tollBox{
    background:var(--gold-soft);border:1px solid var(--gold);
    border-radius:var(--radius-md);padding:13px 16px 11px;margin:16px 0;
    font-size:14px;
  }
  .tollBox > b{display:block;color:var(--gold-dark);font-size:14.5px;margin-bottom:6px;}
  .tollBox ul{margin:0;padding-inline-start:20px;line-height:1.65;}
  .tollBox li{margin-bottom:4px;}
  .tollBox .none{color:var(--green-txt);font-weight:700;}
  .trafficList{padding-inline-start:20px;margin:0 0 16px;font-size:14.3px;line-height:1.7;}
  .trafficList li{margin-bottom:7px;}
  .trafficList .when{color:var(--red-dark);font-weight:700;}

  .photoGallery{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .photoGallery figure{
    margin:0;flex:1 1 260px;position:relative;
    border-radius:var(--radius-md);overflow:hidden;
    height:190px;
    background:var(--cream-2);
    box-shadow:var(--shadow-soft);
  }
  .photoGallery figure a{display:block;width:100%;height:100%;}
  .photoGallery img{
    width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .3s ease;
  }
  .photoGallery figure:hover img{transform:scale(1.06);}
  .photoGallery figcaption{
    position:absolute;inset-inline-start:0;bottom:0;width:100%;
    background:linear-gradient(0deg, rgba(60,20,24,.80), rgba(60,20,24,0));
    color:#fff;font-size:12.5px;padding:22px 12px 8px;
    text-align:start;
  }

  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px 26px 26px;box-shadow:var(--shadow-soft);}
  .panel .tag{color:var(--red);font-weight:700;font-size:14.5px;margin-bottom:4px;}
  .panel h2.title{font-size:28px;color:var(--red-dark);margin-bottom:6px;}
  .panel .meta{color:var(--muted);font-size:13.5px;margin-bottom:16px;}

  table.sched{width:100%;border-collapse:collapse;margin-bottom:18px;font-size:14.5px;}
  table.sched td{padding:11px 12px;border-bottom:1px solid #F3E7E7;}
  table.sched td:last-child{width:120px;font-weight:700;background:var(--cream-2);text-align:center;border-radius:10px;color:var(--red-dark);}
  table.sched tr:last-child td{border-bottom:none;}

  .sectionLabel{font-family:'Frank Ruhl Libre',serif;font-weight:700;color:var(--red-dark);font-size:16.5px;margin:18px 0 8px;}

  .places{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
  .places .p{font-size:14px;line-height:1.6;}
  .places .p b{color:var(--red);}
  .places .p a{color:var(--red-dark);font-weight:700;text-decoration:underline;}

  .boxes{display:flex;gap:14px;margin:16px 0;flex-wrap:wrap;}
  .box{flex:1 1 220px;border-radius:var(--radius-md);padding:14px 16px;font-size:14px;}
  .box b{display:block;margin-bottom:4px;font-size:14px;}
  .box.green{background:var(--gold-soft);}
  .box.green b{color:var(--gold-dark);}
  .box.red{background:var(--red-soft);}
  .box.red b{color:var(--red-dark);}
  .box.yellow{background:var(--yellow-bg);}
  .box.tan{background:var(--cream-2);}

  table.kids{width:100%;border-collapse:collapse;font-size:13.8px;margin-bottom:6px;}
  table.kids td{padding:8px 10px;border-bottom:1px solid #F3E7E7;vertical-align:top;}
  table.kids td:last-child{width:150px;background:var(--cream-2);border-radius:8px;font-size:12.8px;color:var(--muted);}

  /* ---------- Costs page: one block per family rather than a wide matrix, because a
     6-column table is unreadable on a phone and this site is used mostly on mobile. ---------- */
  .costFam{
    background:#fff;border:1px solid var(--line);border-inline-start:4px solid var(--gold);
    border-radius:var(--radius-md);padding:14px 16px;margin-bottom:14px;
    box-shadow:var(--shadow-soft);
  }
  .costFam h3{font-size:17px;color:var(--red-dark);margin-bottom:2px;}
  .costFam .who{color:var(--muted);font-size:12.8px;margin-bottom:10px;}
  .costFam table{width:100%;border-collapse:collapse;font-size:14px;}
  .costFam td{padding:6px 2px;border-bottom:1px solid #F6EDED;}
  .costFam td:last-child{text-align:end;font-weight:700;white-space:nowrap;width:80px;}
  .costFam td .dnum{display:inline-block;min-width:32px;color:var(--muted);font-size:11.5px;margin-inline-end:6px;}
  .costFam tr.sum td{border-bottom:none;border-top:2px solid var(--gold);padding-top:9px;font-weight:800;color:var(--red-dark);font-size:15.5px;}
  .costFam tr.free td:last-child{color:var(--green-txt);}
  /* ---------- Boarding-pass card for the flight details ----------
     Laid out LTR because the whole content is airline data (codes, times, flight numbers)
     that reads left-to-right even on a Hebrew page. The dashed rule plus the two notches
     cut into the sides are the tear-off perforation. */
  .bpass{
    direction:ltr;
    background:linear-gradient(160deg,#fff 0%,#FFFBFB 55%,var(--cream-2) 100%);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    margin-bottom:14px;
    box-shadow:var(--shadow-soft);
    overflow:hidden;
  }
  .bpass-head{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--red-dark);color:#fff;
    padding:9px 16px;
  }
  .bpass-airline{font-size:12.5px;font-weight:700;letter-spacing:.4px;}
  .bpass-no{
    font-family:'Frank Ruhl Libre',serif;
    font-size:17px;font-weight:800;color:var(--gold-soft);
  }
  .bpass-route{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:16px 16px 12px;
  }
  .bpass-end{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .bpass-end.arr{text-align:right;align-items:flex-end;}
  .bpass-code{
    font-family:'Frank Ruhl Libre',serif;
    font-size:30px;font-weight:900;color:var(--red-dark);line-height:1;
  }
  .bpass-city{font-size:11.5px;color:var(--muted);}
  .bpass-time{font-size:19px;font-weight:800;color:var(--ink);margin-top:5px;}
  .bpass-mid{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    color:var(--gold-dark);min-width:70px;
  }
  .bpass-dur{font-size:11.5px;font-weight:700;}
  .bpass-path{
    position:relative;width:100%;height:14px;
    display:flex;align-items:center;justify-content:center;
  }
  .bpass-path::before{
    content:"";position:absolute;left:0;right:0;top:50%;
    border-top:2px dotted var(--gold);
  }
  .bpass-plane{
    position:relative;background:var(--cream-2);
    padding:0 5px;font-size:14px;line-height:1;
  }
  .bpass-tear{
    position:relative;
    border-top:2px dashed var(--line);
    margin:0 12px;
  }
  .bpass-tear::before,.bpass-tear::after{
    content:"";position:absolute;top:-9px;
    width:16px;height:16px;border-radius:50%;
    background:var(--cream);
    border:1px solid var(--line);
  }
  .bpass-tear::before{left:-20px;}
  .bpass-tear::after{right:-20px;}
  .bpass-meta{
    display:flex;flex-wrap:wrap;gap:12px 22px;
    padding:12px 16px 14px;
  }
  .bpass-meta div{display:flex;flex-direction:column;gap:1px;}
  .bpass-meta .k{font-size:10.5px;color:var(--muted);font-weight:600;}
  .bpass-meta .v{font-size:13.5px;font-weight:700;color:var(--ink);}
  .bpass-bars{
    height:26px;margin:0 16px 14px;border-radius:3px;
    background-image:repeating-linear-gradient(90deg,
      var(--ink) 0 2px, transparent 2px 4px,
      var(--ink) 4px 5px, transparent 5px 9px,
      var(--ink) 9px 12px, transparent 12px 14px);
    opacity:.55;
  }
  /* ---------- Checklist page: collapsible sections of tick-boxes. State lives in
     localStorage, so each family ticks their own copy on their own device — there is no
     backend here, and nothing syncs between phones. ---------- */
  .ckProgress{
    background:linear-gradient(135deg, var(--red-dark), var(--red));
    color:#fff;border-radius:var(--radius-lg);padding:15px 18px;margin-bottom:18px;
    box-shadow:var(--shadow-pop);
  }
  .ckProgress .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px;}
  .ckProgress .big{font-family:'Frank Ruhl Libre',serif;font-size:27px;font-weight:800;line-height:1;}
  .ckProgress .cap{font-size:12.5px;opacity:.9;}
  .ckBar{height:8px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden;}
  .ckBar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .35s ease;}
  .ckSec{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);
    margin-bottom:12px;box-shadow:var(--shadow-soft);overflow:hidden;
  }
  .ckHead{
    all:unset;display:flex;align-items:center;gap:10px;width:100%;
    cursor:pointer;padding:12px 15px;box-sizing:border-box;
  }
  .ckHead .ic{font-size:19px;line-height:1;flex:0 0 auto;}
  .ckHead .nm{font-weight:800;font-size:15.5px;color:var(--red-dark);flex:1;min-width:0;}
  .ckHead .cnt{
    font-size:11.5px;font-weight:800;color:var(--gold-dark);
    background:var(--gold-soft);border-radius:99px;padding:2px 9px;flex:0 0 auto;
  }
  .ckSec.done .ckHead .cnt{background:var(--green-bg);color:var(--green-txt);}
  .ckHead .car{color:var(--muted);font-size:13px;transition:transform .2s ease;flex:0 0 auto;}
  .ckSec.open .ckHead .car{transform:rotate(180deg);}
  .ckBody{display:none;padding:0 15px 12px;}
  .ckSec.open .ckBody{display:block;}
  .ckItem{
    display:flex;align-items:flex-start;gap:10px;
    padding:9px 0;border-top:1px solid #F6EDED;cursor:pointer;
  }
  .ckBox{
    flex:0 0 auto;width:21px;height:21px;margin-top:1px;border-radius:6px;
    border:2px solid var(--line);background:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;color:#fff;line-height:1;transition:.15s;
  }
  .ckItem.on .ckBox{background:var(--green-txt);border-color:var(--green-txt);}
  .ckItem .txt{font-size:14.2px;line-height:1.5;}
  .ckItem .txt small{display:block;color:var(--muted);font-size:12.3px;margin-top:1px;}
  .ckItem.on .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line);}
  .ckItem.on .txt small{text-decoration:none;}
  .ckTools{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap;}
  .ckTools button{
    all:unset;cursor:pointer;font-size:13px;font-weight:700;
    padding:9px 16px;border-radius:99px;border:1px solid var(--line);
    background:var(--cream-2);color:var(--ink);
  }
  .ckTools button:hover{background:#f5dfe1;}
  /* ---------- Forecast page: destinations down the side, days across the top.
     The table scrolls sideways on a phone rather than shrinking to unreadable columns,
     and the place column is pinned so you always know which row you're reading. ---------- */
  .fcLoading{color:var(--muted);font-size:14px;padding:14px 2px;}
  .fcWrap{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .fcWrap::-webkit-scrollbar{display:none;}
  .fcTable{border-collapse:separate;border-spacing:0;width:100%;}
  .fcTable th,.fcTable td{padding:8px 6px;text-align:center;vertical-align:middle;}
  .fcTable thead th{
    border-bottom:2px solid var(--line);
    min-width:64px;
  }
  .fcTable thead th .wd{display:block;font-size:11px;font-weight:800;color:var(--red-dark);}
  .fcTable thead th .dt{display:block;font-size:10.5px;color:var(--muted);font-weight:600;}
  .fcTable th.fcPlace .nm{display:block;white-space:nowrap;}
  .fcTable th.fcPlace .nt{display:block;font-size:10px;color:var(--muted);font-weight:600;}
  .fcTable thead th .trip{
    display:block;margin-top:3px;font-size:8.5px;font-weight:800;max-width:60px;
    margin-inline:auto;
    color:var(--gold-dark);background:var(--gold-soft);border-radius:99px;
    padding:1px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .fcTable th.fcPlace{
    position:sticky;inset-inline-start:0;z-index:2;
    background:var(--cream);
    text-align:start;font-size:12.5px;font-weight:700;color:var(--ink);
    min-width:92px;max-width:92px;
    border-bottom:1px solid #F6EDED;
    box-shadow:6px 0 8px -8px rgba(43,35,32,.35);
  }
  .fcTable tbody td{border-bottom:1px solid #F6EDED;}
  .fcTable tbody tr:last-child td,.fcTable tbody tr:last-child th{border-bottom:none;}
  .fcTable .fcToday{background:var(--gold-soft);}
  .fcTable td .ic{display:block;font-size:17px;line-height:1.2;}
  .fcTable td .tm{display:block;font-size:12px;color:var(--muted);}
  .fcTable td .tm b{color:var(--red-dark);font-size:13.5px;margin-inline-end:3px;}
  .fcTable td .rn{display:block;font-size:10.5px;color:#3d7a9e;font-weight:600;}
  .fcTable td .rn.wet{color:var(--red);font-weight:800;}
  .fcLegend{margin-top:9px;font-size:11.5px;color:var(--muted);}
  /* ---------- Restaurant recommendations, appended to each day ---------- */
  .eats{display:flex;flex-direction:column;gap:9px;margin-bottom:8px;}
  .eat{
    display:flex;align-items:flex-start;gap:10px;
    background:#fff;border:1px solid var(--line);border-inline-start:3px solid var(--gold);
    border-radius:var(--radius-md);padding:11px 13px;
  }
  .eat .body{flex:1;min-width:0;}
  .eat .nm{font-weight:800;font-size:14.5px;color:var(--red-dark);}
  .eat .nm .tagline{
    font-weight:700;font-size:10.5px;color:var(--gold-dark);
    background:var(--gold-soft);border-radius:99px;padding:1px 7px;margin-inline-start:6px;
    white-space:nowrap;
  }
  .eat .ds{font-size:13.3px;line-height:1.5;margin-top:2px;}
  .eat .lk{margin-top:5px;font-size:12.5px;}
  .eat .lk a{color:var(--red-dark);font-weight:700;text-decoration:underline;}
  .eat .nav{
    flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
    width:30px;height:30px;border-radius:50%;background:var(--gold-soft);
    font-size:15px;text-decoration:none;line-height:1;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .eat .nav:hover{box-shadow:var(--shadow-soft);transform:scale(1.1);}
  .footerbar{background:var(--red-dark);color:#fff;padding:13px 16px;border-radius:var(--radius-md);font-size:14px;font-weight:500;margin-top:16px;display:flex;align-items:center;gap:8px;}

  ul.altlist{padding-inline-start:20px;margin:0 0 16px;font-size:14.3px;line-height:1.7;}
  ol.checklist{padding-inline-start:20px;margin:0 0 16px;font-size:14.3px;line-height:1.75;}

  /* ---------- Site-wide search: a 🔍 tab opens a full-screen search sheet.
     The index is built once, lazily, by rendering every day into a detached element. ---------- */
  .searchSheet{
    position:fixed;inset:0;z-index:4000;
    background:var(--cream);
    display:flex;flex-direction:column;
  }
  .searchSheet[hidden]{display:none;}
  body.searchOpen{overflow:hidden;}
  .searchBar{
    display:flex;align-items:center;gap:8px;
    padding:14px 16px;
    background:linear-gradient(180deg,#fff,#FFFAF9);
    border-bottom:3px solid var(--red);
  }
  .searchBar input{
    flex:1;min-width:0;
    font-family:'Heebo',sans-serif;font-size:16px;
    padding:11px 16px;border-radius:999px;
    border:2px solid var(--line);background:#fff;color:var(--ink);
  }
  .searchBar input:focus{outline:none;border-color:var(--gold);}
  .searchClose{
    all:unset;cursor:pointer;flex:0 0 auto;
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:17px;color:var(--red-dark);background:var(--cream-2);
  }
  .searchClose:active{transform:scale(.94);}
  .searchResults{flex:1;overflow-y:auto;padding:14px 16px 50px;}
  .searchHint,.searchEmpty{color:var(--muted);font-size:14px;line-height:1.7;padding:10px 2px;}
  .searchGroup{margin-bottom:20px;}
  .searchGroupHead{
    font-family:'Frank Ruhl Libre',serif;font-weight:700;
    color:var(--red-dark);font-size:16px;margin:0 0 8px;
  }
  .searchItem{
    display:block;width:100%;text-align:start;
    background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);
    padding:11px 13px;margin-bottom:8px;cursor:pointer;
    font-family:inherit;font-size:14px;color:var(--ink);line-height:1.55;
  }
  .searchItem:hover{background:var(--cream-2);}
  .searchItem .kind{display:block;font-size:11.5px;font-weight:700;color:var(--gold-dark);margin-bottom:3px;}
  .searchItem mark,.searchPlaceRow mark{background:var(--gold-soft);color:var(--red-dark);font-weight:700;border-radius:3px;padding:0 2px;}
  .searchPlaceRow{
    display:flex;align-items:center;gap:6px;
    background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);
    padding:11px 13px;margin-bottom:8px;font-size:14px;
  }
  .searchPlaceRow .nm{flex:1;min-width:0;}
  .searchHit{animation:searchFlash 2.2s ease;scroll-margin-top:120px;}
  @keyframes searchFlash{
    0%,55%{background:var(--gold-soft);}
    100%{background:transparent;}
  }
  @media (prefers-reduced-motion: reduce){
    .searchHit{animation:none;outline:2px solid var(--gold);outline-offset:2px;}
  }

  @media (max-width: 860px){
    body{font-size:16px;}
    header.top{padding:20px 18px 18px;}
    header.top h1{font-size:27px;}
    .countdown{font-size:12px;padding:5px 12px;}
    .layout{padding:16px 14px 88px;gap:16px;}
    nav.daynav{top:0;padding:8px 0 4px;gap:8px;}
    .tabbar button{padding:8px 2px 9px;font-size:10.5px;}
    .tabbar button .icon{font-size:18px;}
    .costFam{padding:12px 13px;}
    .costFam table{font-size:13.5px;}
    .bpass-code{font-size:26px;}
    .bpass-time{font-size:17px;}
    .bpass-route{padding:14px 13px 10px;gap:6px;}
    .bpass-mid{min-width:56px;}
    .bpass-meta{padding:11px 13px 12px;gap:10px 16px;}
    .bpass-bars{margin:0 13px 12px;height:22px;}
    .bpass-tear::before{left:-19px;}

/* ---------- Forecast page: today + 5 days for several destinations at once ----------
   One Open-Meteo request covers all of them (the API accepts comma-separated coordinates
   and returns an array in the same order). Destinations were picked to be the ones the
   itinerary is flexible about — Grossglockner and Hallstatt in particular are swapped to
   the clearest day, so seeing them side by side is the whole point. */
const FORECAST_LOCS = [
  {k:"krakow",      nm:"קרקוב",         note:"הבסיס"},
  {k:"energylandia",nm:"Energylandia",  note:""},
  {k:"dunajec",     nm:"פייניני",        note:"רפטינג"},
  {k:"gubalowka",   nm:"זקופנה",         note:""},
  {k:"bania",       nm:"Białka Tatrzańska", note:"בריכות חמות"},
];

const FORECAST_DAYS = 16;   // Open-Meteo's maximum; the window reaches the trip from ~8.9 onward

function renderForecast(){
  return `
    <div class="tag">מזג אוויר</div>
    <h2 class="title">🌦️ תחזית לאזור הטיול</h2>
    <div class="meta">עד 16 ימים קדימה, בכמה יעדים במקביל — כדי להחליט איזה יום מקדישים לאיזה מקום. גללו לצדדים.</div>
    <div id="fcRoot"><div class="fcLoading">טוען תחזית…</div></div>
    <div class="box tan" style="margin-top:16px;"><b>איך להשתמש בזה</b>ימי הקרוואן בהרים (9-11.6) הכי רגישים למזג האוויר. אם צפוי גשם ביום של הטטרה — מחליפים בין הימים או עוברים לבריכות החמות. ימים ששייכים לטיול מסומנים בכותרת בשם היעד של אותו יום.</div>
    <div class="box yellow" style="margin-top:12px;"><b>עד כמה לסמוך על זה</b>התחזית נמתחת 16 יום קדימה, אבל הדיוק יורד ככל שמתרחקים: 1-3 ימים אמינים מאוד, 4-7 ימים סבירים, ומעבר ל-10 ימים זו יותר מגמה מאשר תחזית. אל תקבעו סופית את יום הטטרה לפני שהוא נכנס לטווח של 3-4 ימים.</div>
  `;
}

async function initForecast(){
  const root = document.getElementById("fcRoot");
  if (!root) return;
  const lats = FORECAST_LOCS.map(o=>LOC[o.k].lat).join(",");
  const lons = FORECAST_LOCS.map(o=>LOC[o.k].lon).join(",");
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}`
    + `&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max`
    + `&timezone=Europe%2FWarsaw&forecast_days=${FORECAST_DAYS}`;
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error("http " + resp.status);
    let data = await resp.json();
    if (!Array.isArray(data)) data = [data];   // a single-location query returns a bare object
    const dates = data[0]?.daily?.time || [];
    if (!dates.length) throw new Error("no data");

    // Column headers: weekday + date, flagged when the date is one of our trip days.
    const heads = dates.map((iso,i)=>{
      const wd = WEEKDAY_HE_SHORT[new Date(iso+"T00:00:00").getDay()];
      const [ , m, d ] = iso.split("-");
      const tripId = Object.keys(DAY_DATES).find(k=>DAY_DATES[k]===iso);
      const tripDay = tripId ? DAYS.find(x=>x.id===tripId) : null;
      return `<th class="${i===0?"fcToday":""}">
        <span class="wd">${i===0?"היום":wd}</span>
        <span class="dt">${+d}.${+m}</span>
        ${tripDay?`<span class="trip">${tripDay.navSub}</span>`:""}
      </th>`;
    }).join("");

    const rows = FORECAST_LOCS.map((o,li)=>{
      const d = data[li]?.daily;
      if (!d) return "";
      const cells = dates.map((_,i)=>{
        const max = Math.round(d.temperature_2m_max[i]);
        const min = Math.round(d.temperature_2m_min[i]);
        const rain = d.precipitation_probability_max[i];
        const wet = rain >= 50;
        return `<td class="${i===0?"fcToday":""}">
          <span class="ic">${weatherEmoji(d.weathercode[i])}</span>
          <span class="tm"><b>${max}°</b>${min}°</span>
          <span class="rn${wet?" wet":""}">${rain}%</span>
        </td>`;
      }).join("");
      return `<tr><th scope="row" class="fcPlace">
        <span class="nm">${LOC_ICON[o.k]||"📍"} ${o.nm}</span>
        ${o.note?`<span class="nt">${o.note}</span>`:""}
      </th>${cells}</tr>`;
    }).join("");

    const covered = dates.filter(d => Object.values(DAY_DATES).includes(d)).length;
    const coverMsg = covered
      ? `התחזית כבר מכסה ${covered} מתוך 8 ימי הטיול.`
      : "התחזית עדיין לא מגיעה לימי הטיול — חזרו לכאן קרוב יותר לתאריך.";

    root.innerHTML = `<div class="fcWrap"><table class="fcTable">
      <thead><tr><th class="fcPlace"></th>${heads}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>

const CK_KEY = "poland2027_checklist_v1";
let ckState = {};
try { ckState = JSON.parse(localStorage.getItem(CK_KEY) || "{}"); } catch(e){ ckState = {}; }
function ckSave(){ try { localStorage.setItem(CK_KEY, JSON.stringify(ckState)); } catch(e){} }
function ckKey(si, ii){ return CHECKLIST[si].id + ":" + ii; }

function renderChecklist(){
  return `
    <div class="tag">לפני שיוצאים</div>
    <h2 class="title">✅ הצ׳קליסט שלנו</h2>
    <div class="meta">כל משפחה מסמנת לעצמה. הסימון נשמר במכשיר — אפשר לסגור ולחזור.</div>
    <div class="ckProgress">
      <div class="row">
        <span class="big" id="ckPct">0%</span>
        <span class="cap" id="ckCap">0 מתוך 0 בוצעו</span>
      </div>
      <div class="ckBar"><i id="ckFill" style="width:0%"></i></div>
    </div>
    <div id="ckRoot">${CHECKLIST.map((sec, si) => {
      const done = sec.items.filter((_,ii)=>ckState[ckKey(si,ii)]).length;
      return `<div class="ckSec${done===sec.items.length?" done":""}${si===0?" open":""}" data-s="${si}">
        <button type="button" class="ckHead">
          <span class="ic">${sec.ic}</span>
          <span class="nm">${sec.name}</span>
          <span class="cnt">${done}/${sec.items.length}</span>
          <span class="car">▾</span>
        </button>
        <div class="ckBody">${sec.items.map((it,ii)=>{
          const on = !!ckState[ckKey(si,ii)];
          return `<div class="ckItem${on?" on":""}" data-s="${si}" data-i="${ii}">
            <span class="ckBox">${on?"✓":""}</span>
            <span class="txt">${it.t}${it.s?`<small>${it.s}</small>`:""}</span>
          </div>`;
        }).join("")}</div>
      </div>`;
    }).join("")}</div>
    <div class="ckTools">
      <button type="button" id="ckOpenAll">פתח הכל</button>
      <button type="button" id="ckCloseAll">סגור הכל</button>
      <button type="button" id="ckReset">אפס סימונים</button>
    </div>
    <div class="box tan" style="margin-top:16px;"><b>איך זה עובד</b>הסימונים נשמרים בדפדפן של המכשיר שסימנתם בו, ולא משותפים בין המשפחות — לכל משפחה רשימה משלה. אם תפתחו את האתר בטלפון אחר, הרשימה שם תהיה ריקה.</div>
  `;
}

function ckUpdateProgress(){
  let total=0, done=0;
  CHECKLIST.forEach((sec,si)=>sec.items.forEach((_,ii)=>{ total++; if(ckState[ckKey(si,ii)]) done++; }));
  const pct = total ? Math.round(done/total*100) : 0;
  const p = document.getElementById("ckPct");
  if (!p) return;
  p.textContent = pct + "%";
  document.getElementById("ckCap").textContent = `${done} מתוך ${total} בוצעו`;
  document.getElementById("ckFill").style.width = pct + "%";
}

// Wired once per render of the checklist page, via delegation on #ckRoot.
function initChecklist(){
  const root = document.getElementById("ckRoot");
  if (!root) return;
  ckUpdateProgress();
  root.addEventListener("click", e => {
    const head = e.target.closest(".ckHead");
    if (head){ head.parentElement.classList.toggle("open"); return; }
    const item = e.target.closest(".ckItem");
    if (!item) return;
    const si = +item.dataset.s, ii = +item.dataset.i, k = ckKey(si,ii);
    ckState[k] = !ckState[k];
    ckSave();
    // repaint just this row and its section counter, so open/closed state is preserved
    const sec = item.closest(".ckSec");
    item.classList.toggle("on", !!ckState[k]);
    item.querySelector(".ckBox").textContent = ckState[k] ? "✓" : "";
    const secDone = CHECKLIST[si].items.filter((_,j)=>ckState[ckKey(si,j)]).length;
    sec.querySelector(".cnt").textContent = secDone + "/" + CHECKLIST[si].items.length;
    sec.classList.toggle("done", secDone === CHECKLIST[si].items.length);
    ckUpdateProgress();
  });
  document.getElementById("ckOpenAll")?.addEventListener("click", ()=>
    root.querySelectorAll(".ckSec").forEach(s=>s.classList.add("open")));
  document.getElementById("ckCloseAll")?.addEventListener("click", ()=>
    root.querySelectorAll(".ckSec").forEach(s=>s.classList.remove("open")));
  document.getElementById("ckReset")?.addEventListener("click", ()=>{
    if(!confirm("לאפס את כל הסימונים?")) return;
    ckState = {}; ckSave(); selectDay("checklist");
  });
}

/* ---------- Destination photos (Wikimedia Commons) ---------- */
function wmFile(name, width){
  return "https://commons.wikimedia.org/wiki/Special:FilePath/" + encodeURIComponent(name.replace(/ /g,"_")) + "?width=" + (width||1400);
}
function wmPage(name){
  return "https://commons.wikimedia.org/wiki/File:" + encodeURIComponent(name.replace(/ /g,"_"));
}
// f = an exact Wikimedia Commons file name (verified). w = a Wikipedia article ("en:Title" / "pl:Title"):
// its lead photo is fetched at runtime from the Wikipedia REST API (CORS-enabled), so the picture is
// always one that actually exists. Anything that fails to load simply hides itself.
const IMAGES = {
  d1:  [ {f:"Wawel castle.jpg", alt:"גבעת ואוול"}, {f:"Kraków - Sukiennice 1.jpg", alt:"Sukiennice ברחבת השוק, קרקוב"} ],
  d7:  [ {w:"en:Wieliczka_Salt_Mine", alt:"מכרה המלח Wieliczka"}, {f:"Szeroka street, Kazimierz, Krakow, Poland.jpg", alt:"רחוב Szeroka, קז׳ימייז׳"} ],
  d2:  [ {f:"Zadra (Energylandia) - First Drop.jpg", alt:"רכבת ההרים Zadra, Energylandia"}, {f:"Energylandia - Mayan 2018.jpg", alt:"Energylandia"} ],
  d8:  [ {f:"Maczuga Herkulesa (background Castle Pieskowa Skała).jpg", alt:"אלת הרקולס וטירת Pieskowa Skała"}, {w:"en:Ojców_National_Park", alt:"פארק לאומי Ojców"} ],
  d3:  [ {f:"Niedzica zamek o zachodzie.jpg", alt:"טירת Niedzica בשקיעה"}, {w:"en:Czorsztyn_Lake", alt:"אגם Czorsztyn"} ],
  d4:  [ {w:"en:Dunajec_River_Gorge", alt:"קניון הדונאיץ"}, {w:"pl:Terma_Bania", alt:"Termy Bania"} ],
  d5:  [ {w:"en:Gubałówka", alt:"גובאלובקה"}, {w:"en:Krupówki", alt:"רחוב Krupówki"} ],
  d6:  [ {w:"pl:Bonarka_City_Center", alt:"קניון Bonarka City Center"} ],
};
const WIKI_IMG_CACHE = {};
async function wikiLeadImage(spec){
  if (WIKI_IMG_CACHE[spec]) return WIKI_IMG_CACHE[spec];
  const [lang, title] = spec.split(":");
  const p = fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`)
    .then(r => r.ok ? r.json() : null)
    .then(j => j && (j.thumbnail || j.originalimage) ? {
        src: (j.originalimage && j.originalimage.width <= 1600 ? j.originalimage.source : (j.thumbnail ? j.thumbnail.source.replace(/\/\d+px-/, "/1200px-") : j.originalimage.source)),
        page: (j.content_urls && j.content_urls.desktop && j.content_urls.desktop.page) || `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(title)}`
      } : null)
    .catch(() => null);
  WIKI_IMG_CACHE[spec] = p;
  return p;
}
function fillWikiImages(root){
  root.querySelectorAll("figure[data-wiki]").forEach(async fig => {
    const r = await wikiLeadImage(fig.dataset.wiki);
    if (!r){ fig.style.display = "none"; return; }
    const a = fig.querySelector("a"), img = fig.querySelector("img");
    a.href = r.page;
    img.onerror = () => { fig.style.display = "none"; };
    img.src = r.src;
  });
}

/* ---------- Weather: per-day forecast (Open-Meteo, no key needed) for the day's
   main destination, shown between the map and the schedule. ---------- */
const WEATHER_LOC = {
  d1:"krakow", d2:"energylandia", d3:"niedzica", d4:"dunajec",
  d5:"gubalowka", d6:"bonarka", d7:"wieliczka", d8:"ojcow",
};
const WEATHER_CACHE = {};
let weatherSeq = 0;

function weatherEmoji(code){
  if (code === 0) return "☀️";
  if (code === 1 || code === 2) return "🌤️";
  if (code === 3) return "☁️";
  if (code === 45 || code === 48) return "🌫️";
  if ([51,53,55,56,57,80,81,82].includes(code)) return "🌦️";
  if ([61,63,65,66,67].includes(code)) return "🌧️";
  if ([71,73,75,77,85,86].includes(code)) return "❄️";
  if ([95,96,99].includes(code)) return "⛈️";
  return "🌡️";
}

/* Which clock hours a given day's schedule actually spans, read straight from that day's
   table so it can never drift out of sync when times are edited. Used to tint the hours
   the family is out of the hotel. */
function dayHourRange(id){
  const day = DAYS.find(d=>d.id===id);
  if (!day) return null;
  const tmp = document.createElement("div");
  tmp.innerHTML = day.render();
  const hours = [];
  tmp.querySelectorAll("table.sched tr").forEach(tr=>{
    const tds = tr.querySelectorAll("td");
    if (tds.length < 2) return;
    for (const m of tds[1].textContent.matchAll(/(\d{1,2}):(\d{2})/g)){
      hours.push(parseInt(m[1],10));
    }
  });
  if (!hours.length) return null;
  return [Math.min(...hours), Math.max(...hours)];
}

const HOUR_FROM = 6, HOUR_TO = 22;   // outside this the strip is just padding

function renderHourly(hourly, id){
  if (!hourly || !hourly.time || !hourly.time.length) return "";
  const range = dayHourRange(id);
  const cells = [];
  hourly.time.forEach((iso, i) => {
    const h = parseInt(iso.slice(11,13), 10);
    if (h < HOUR_FROM || h > HOUR_TO) return;
    const t = Math.round(hourly.temperature_2m[i]);
    const r = hourly.precipitation_probability?.[i];
    const out = range && h >= range[0] && h <= range[1];
    cells.push(`<div class="wxHour${out?" out":""}">
      <div class="hr">${String(h).padStart(2,"0")}</div>
      <div class="ic">${weatherEmoji(hourly.weathercode[i])}</div>
      <div class="tp">${t}°</div>
      <div class="rn${r>=50?" wet":""}">${r==null?"–":r+"%"}</div>
    </div>`);
  });
  if (!cells.length) return "";
  return `<div class="wxHours">${cells.join("")}</div>
    <div class="wxNote">${range?"מודגש בזהב: השעות שאתם בחוץ לפי הלו״ז של היום. ":""}גללו לצדדים לשעות נוספות.</div>`;
}

async function injectWeather(id){
  const card = document.getElementById("weatherCard");
  const locKey = WEATHER_LOC[id];
  const date = DAY_DATES[id];
  if (!locKey || !date){
    card.hidden = true;
    return;
  }
  const mySeq = ++weatherSeq;
  card.hidden = false;
  card.innerHTML = `<div class="wxTop"><span class="weatherLoading">🌦️ טוען תחזית ל-${LOC[locKey].label}…</span></div>`;

  const cacheKey = locKey + "_" + date;
  try {
    let data = WEATHER_CACHE[cacheKey];
    if (!data){
      const loc = LOC[locKey];
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}`
        + `&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max`
        + `&hourly=temperature_2m,precipitation_probability,weathercode`
        + `&timezone=Europe%2FWarsaw&start_date=${date}&end_date=${date}`;
      const resp = await fetch(url);
      if (!resp.ok) throw new Error("weather http " + resp.status);
      data = await resp.json();
      WEATHER_CACHE[cacheKey] = data;
    }
    if (mySeq !== weatherSeq) return; // a newer day was selected meanwhile — drop this result
    const d = data.daily;
    if (!d || !d.time || !d.time.length){
      card.innerHTML = `<div class="wxTop"><span class="weatherNA">📅 התחזית ל-${LOC[locKey].label} עדיין לא זמינה — תופיע כאן כשבועיים-שלושה לפני התאריך.</span></div>`;
      return;
    }
    const code = d.weathercode[0];
    const max = Math.round(d.temperature_2m_max[0]);
    const min = Math.round(d.temperature_2m_min[0]);
    const rain = d.precipitation_probability_max[0];
    card.innerHTML = `
      <div class="wxTop">
        <span class="weatherIcon">${weatherEmoji(code)}</span>
        <span class="weatherTemps"><b>${max}°</b> / ${min}°</span>
        <span class="weatherRain">🌧️ ${rain}%</span>
        <span class="weatherLoc">${LOC[locKey].label}</span>
      </div>
      ${renderHourly(data.hourly, id)}
    `;
    scrollHoursIntoView(card);
  } catch(e){
    if (mySeq !== weatherSeq) return;
    card.innerHTML = `<div class="wxTop"><span class="weatherNA">מזג האוויר לא נטען כרגע — שאר האתר פועל כרגיל.</span></div>`;
  }
}

// The strip starts at 06:00, but the hours worth looking at are the ones on the schedule —
// so nudge it to the first gold cell instead of leaving the user on an empty dawn.
// scrollIntoView is used rather than setting scrollLeft: horizontal scroll offsets are
// mirrored (and inconsistently signed) in RTL, and this sidesteps that entirely.
// block:"nearest" keeps it from scrolling the page vertically as a side effect.
function scrollHoursIntoView(card){
  const first = card.querySelector(".wxHour.out");
  if (first) first.scrollIntoView({inline:"start", block:"nearest"});
}

/* ---------- Leaflet map: full route (muted) + today's highlighted segment,
   drawn as the real driving road (via OSRM, no key) with a straight-line fallback,
   plus a base-layer toggle (street/topo) and a fullscreen mode. ---------- */
let leafletMap = null;
let mapLayers = []; // markers/polylines currently on the map, cleared+rebuilt on each render
let mapGen = 0;      // bumped on every updateMap() call so stale async work (routes, animations) can bail out
let streetLayer = null, topoLayer = null;
let currentLayerMode = "street";

const ROUTE_CACHE = {};
async function fetchRoute(keys){
  const cacheKey = keys.join(",");
  if (ROUTE_CACHE[cacheKey]) return ROUTE_CACHE[cacheKey];
  const coordStr = keys.map(k => `${LOC[k].lon},${LOC[k].lat}`).join(";");
  const url = `https://router.project-osrm.org/route/v1/driving/${coordStr}?overview=full&geometries=geojson`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error("osrm http " + resp.status);
  const data = await resp.json();
  if (data.code !== "Ok" || !data.routes || !data.routes.length) throw new Error("osrm no route");
  const route = data.routes[0];
  const result = {
    latlngs: route.geometry.coordinates.map(c => [c[1], c[0]]),
    distanceKm: route.distance / 1000,
    durationMin: route.duration / 60,
  };
  ROUTE_CACHE[cacheKey] = result;
  return result;
}

// Reveals a polyline progressively (a light "drawing" animation) rather than popping in at once.
// `gen` is the mapGen snapshot at call time — if a newer updateMap() has since run, we quietly stop.
function animatePolyline(latlngs, options, gen, duration){
  const line = L.polyline([], options).addTo(leafletMap);
  mapLayers.push(line);
  const total = latlngs.length;
  if (total < 2){ line.setLatLngs(latlngs); return line; }
  const start = performance.now();
  function step(now){
    if (gen !== mapGen) return;
    const t = Math.min(1, (now - start) / duration);
    const count = Math.max(2, Math.round(total * t));
    line.setLatLngs(latlngs.slice(0, count));
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  return line;
}

function initMap(){
  if (typeof L === "undefined"){
    document.getElementById("mapDiv").innerHTML =
      '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:13px;padding:12px;text-align:center;">המפה לא נטענה (בעיית רשת) — שאר האתר פועל כרגיל.</div>';
    return;
  }
  leafletMap = L.map("mapDiv", {scrollWheelZoom:false});
  // CARTO started requiring an API key ("API KEY REQUIRED" on every tile), so the street layer
  // uses OpenStreetMap's standard tiles: no key, just the attribution below.
  streetLayer = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:19,
    attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
  });
  topoLayer = L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
    subdomains:"abc",
    maxZoom:17,
    attribution:"© OpenTopoMap (CC-BY-SA) © OpenStreetMap contributors"
  });
  streetLayer.addTo(leafletMap);

  const layerBtn = document.getElementById("mapLayerBtn");
  if (layerBtn){
    layerBtn.addEventListener("click", () => {
      if (currentLayerMode === "street"){
        leafletMap.removeLayer(streetLayer);
        topoLayer.addTo(leafletMap);
        currentLayerMode = "topo";
        layerBtn.textContent = "🗺️";
        layerBtn.title = "עבור לתצוגת רחוב";
      } else {
        leafletMap.removeLayer(topoLayer);
        streetLayer.addTo(leafletMap);
        currentLayerMode = "street";
        layerBtn.textContent = "🛰️";
        layerBtn.title = "עבור לתצוגה טופוגרפית";
      }
    });
  }

  const fullBtn = document.getElementById("mapFullBtn");
  const mapCardEl = document.getElementById("mapCard");
  if (fullBtn && mapCardEl){
    fullBtn.addEventListener("click", () => {
      const isFull = mapCardEl.classList.toggle("fullscreen");
      document.body.classList.toggle("mapFsOpen", isFull);
      fullBtn.textContent = isFull ? "✕" : "⛶";
      fullBtn.title = isFull ? "סגור מסך מלא" : "הרחב למסך מלא";
      setTimeout(() => leafletMap.invalidateSize(), 260);
    });
  }
}

function fmtRouteInfo(distanceKm, durationMin){
  const km = Math.round(distanceKm);
  const h = Math.floor(durationMin / 60), m = Math.round(durationMin % 60);
  const timeStr = h > 0 ? `${h}:${String(m).padStart(2,"0")} שעות` : `${m} דק׳`;
  return `<span>🛣️ <b>${km}</b> ק"מ</span><span>⏱️ <b>${timeStr}</b> נסיעה</span><span style="opacity:.75">סה״כ כל הנסיעות של היום, לפי סדר העצירות</span>`;
}

async function updateMap(segment, isOverview){
  if (!leafletMap) return;
  mapLayers.forEach(l=>leafletMap.removeLayer(l));
  mapLayers = [];
  const gen = ++mapGen;

  const routeInfoEl = document.getElementById("mapRouteInfo");
  if (routeInfoEl) routeInfoEl.hidden = true;

  const keys = segment.length ? segment : FULL_ROUTE;
  const uniqueKeys = [...new Set(keys)];

  // Straight-line coordinates — drawn immediately so the map never waits on the network,
  // then swapped for the real road route (via OSRM) if/when that resolves.
  const fullStraight = FULL_ROUTE.map(k=>[LOC[k].lat, LOC[k].lon]);
  const segStraight = keys.map(k=>[LOC[k].lat, LOC[k].lon]);

  const FULL_STYLE = isOverview ? {color:"#C8102E", weight:4, opacity:.85} : {color:"#cbb9ba", weight:3, dashArray:"2,8", opacity:.8};
  let fullLine = animatePolyline(fullStraight, FULL_STYLE, gen, 500);
  let segLine = null;
  if (!isOverview && keys.length > 1){
    segLine = animatePolyline(segStraight, {color:"#C8102E", weight:5, opacity:.9}, gen, 650);
  }

  // Markers: Wagrain (home base) gets a pin shape; today's other stops are highlighted red dots;
  // in overview mode all stops are plain muted dots. Clicking a marker pops up its name + a Waze link.
  // Numbered stops. Day view: 1, 2, 3… in the order the day visits them (the home base — the
  // apartment or tonight's campsite — gets 🏠 instead of a number). Overview: the number of the
  // trip day on which each place is first visited, so the whole route reads as days on the map.
  const HOME_KEYS = ["krakow","camp1","camp_zak"];
  const stopNo = {};
  if (isOverview){
    DAYS.filter(d => /^d\d+$/.test(d.id)).forEach(d => d.segment.forEach(k => {
      if (!HOME_KEYS.includes(k) && !(k in stopNo)) stopNo[k] = +d.id.slice(1);
    }));
  } else {
    let n = 0;
    keys.forEach(k => { if (!HOME_KEYS.includes(k) && !(k in stopNo)) stopNo[k] = ++n; });
  }
  uniqueKeys.forEach(k=>{
    const loc = LOC[k];
    const isBase = HOME_KEYS.includes(k);
    const isActive = !isBase;
    const label = isBase ? "🏠" : (stopNo[k] || "•");
    const cls = "map-num" + (isBase ? " home" : (isOverview ? " day" : ""));
    const icon = L.divIcon({className:"", html:`<div class="${cls}">${label}</div>`, iconSize:[24,24], iconAnchor:[12,12]});
    const marker = L.marker([loc.lat, loc.lon], {icon}).addTo(leafletMap);
    const tClass = "map-tooltip" + (isBase ? " base-tooltip" : (isActive ? " active-tooltip" : ""));
    marker.bindTooltip((isBase ? "" : (isOverview ? "יום " + stopNo[k] + " · " : stopNo[k] + ". ")) + loc.label, {className:tClass, direction:"top", offset:[0,-12]});
    marker.bindPopup(
      `<div style="font-family:Heebo,sans-serif;text-align:center;">
        <b>${loc.label}</b><br>
        <a href="${wazeLink(k)}" target="_blank" rel="noopener" style="color:#C8102E;font-weight:700;text-decoration:none;">🧭 נווט ב-Waze</a>
      </div>`
    );
    mapLayers.push(marker);
  });

  // Fit bounds to the relevant set of points (based on the straight-line coordinates —
  // available immediately, and close enough even once the real route comes in).
  const boundsKeys = isOverview ? FULL_ROUTE : uniqueKeys;
  const bounds = L.latLngBounds(boundsKeys.map(k=>[LOC[k].lat, LOC[k].lon]));
  leafletMap.fitBounds(bounds, {padding:[30,30], maxZoom: isOverview ? 9 : 12});
  setTimeout(()=>leafletMap.invalidateSize(), 50);

  // Upgrade to the real driving route in the background; silently keep the straight
  // lines if the routing service is unreachable.
  fetchRoute(FULL_ROUTE).then(r => {
    if (gen !== mapGen) return;
    leafletMap.removeLayer(fullLine);
    const idx = mapLayers.indexOf(fullLine);
    if (idx !== -1) mapLayers.splice(idx, 1);
    fullLine = animatePolyline(r.latlngs, FULL_STYLE, gen, 500);
  }).catch(()=>{});

  if (!isOverview && keys.length > 1){
    fetchRoute(keys).then(r => {
      if (gen !== mapGen) return;
      leafletMap.removeLayer(segLine);
      const idx = mapLayers.indexOf(segLine);
      if (idx !== -1) mapLayers.splice(idx, 1);
      segLine = animatePolyline(r.latlngs, {color:"#C8102E", weight:5, opacity:.9}, gen, 800);
      if (routeInfoEl){
        routeInfoEl.innerHTML = fmtRouteInfo(r.distanceKm, r.durationMin);
        routeInfoEl.hidden = false;
      }
    }).catch(()=>{});
  }
}

function wazeLink(k){
  const loc = LOC[k];
  if (loc.address){
    return `https://waze.com/ul?q=${encodeURIComponent(loc.address)}&navigate=yes`;
  }
  return `https://waze.com/ul?ll=${loc.lat}%2C${loc.lon}&navigate=yes`;
}

function injectRowWaze(id){
  const rules = ROW_WAZE[id];
  if(!rules) return;
  panelEl.querySelectorAll("table.sched td:first-child").forEach(td=>{
    const text = td.textContent;
    const rule = rules.find(([sub])=> text.includes(sub));
    if(!rule) return;

    a.href = wazeLink(locKey);

    a.textContent = "🧭";
    td.appendChild(a);

function injectTraffic(id){
  const rules = TRAFFIC[id];
  if(!rules) return;
  panelEl.querySelectorAll("table.sched td:first-child").forEach(td=>{
    const text = td.textContent;
    const rule = rules.find(([sub])=> text.includes(sub));
    if(!rule) return;
    const [, info] = rule;
    const note = document.createElement("div");
    note.className = "trafficNote";
    note.hidden = true;
    note.innerHTML = `<b>🚦 שעת שיא: ${info.peak}</b><br>${info.text}`;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "rowTraffic";
    btn.textContent = "🚦";
    btn.title = "צפוי עומס - " + info.peak;
    btn.setAttribute("aria-label", "פרטי עומס תנועה");
    btn.setAttribute("aria-expanded", "false");
    btn.addEventListener("click", ()=>{
      const open = note.hidden;
      note.hidden = !open;
      btn.setAttribute("aria-expanded", String(open));
    });
    td.appendChild(btn);
    td.appendChild(note);
  });
}

/* ---------- Smart Waze target: reads today's schedule + the clock, and figures out
   which point on today's route makes sense to navigate to right now. ---------- */
function parseTimeToMinutes(text){
  const m = text.match(/(\d{1,2}):(\d{2})/);
  if(!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}

function getRowTimes(id){
  const rules = ROW_WAZE[id];
  if(!rules) return [];
  const day = DAYS.find(d=>d.id===id);
  if(!day) return [];
  const tmp = document.createElement("div");
  tmp.innerHTML = day.render();
  const out = [];
  tmp.querySelectorAll("table.sched tr").forEach(tr=>{
    const tds = tr.querySelectorAll("td");
    if(tds.length < 2) return;
    const text = tds[0].textContent;
    const rule = rules.find(([sub])=> text.includes(sub));
    if(!rule) return;
    const [, locKey] = rule;
    out.push({loc:locKey, label:text.split("—")[0].trim(), minutes: parseTimeToMinutes(tds[1].textContent)});
  });
  return out;
}

function getSmartTarget(id){
  const rows = getRowTimes(id);
  if(!rows.length) return null;
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  // rows are already in schedule (chronological) order — pick the first one that hasn't
  // happened yet; if the whole day already passed, fall back to the last stop (usually the hotel).
  const upcoming = rows.find(r => r.minutes === null || r.minutes >= nowMin);
  return upcoming || rows[rows.length - 1];
}

/* ---------- Trivia quiz ---------- */
function shuffleArr(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let quizOrder = [];
let quizPos = 0;
let quizScore = 0;

function initTrivia(){
  const root = document.getElementById("quizRoot");
  if (!root) return;
  quizOrder = shuffleArr(TRIVIA.map((_, i) => i));
  quizPos = 0;
  quizScore = 0;
  root.addEventListener("click", onQuizClick);
  renderQuizQuestion();
}

function onQuizClick(e){
  const optBtn = e.target.closest(".quizOption");
  if (optBtn && !optBtn.classList.contains("disabled")){
    handleQuizAnswer(optBtn);
    return;
  }
  const nextBtn = e.target.closest(".quizNextBtn");
  if (nextBtn){
    quizPos++;
    renderQuizQuestion();
    return;
  }
  const againBtn = e.target.closest(".quizAgainBtn");
  if (againBtn){
    quizOrder = shuffleArr(TRIVIA.map((_, i) => i));
    quizPos = 0;
    quizScore = 0;
    renderQuizQuestion();
  }
}

function renderQuizQuestion(){
  const root = document.getElementById("quizRoot");
  if (!root) return;
  if (quizPos >= quizOrder.length){
    renderQuizSummary();
    return;
  }
  const item = TRIVIA[quizOrder[quizPos]];
  const optOrder = shuffleArr(item.options.map((_, i) => i));
  root.innerHTML = `
    <div class="quizCard">
      <div class="quizProgress">
        <span>שאלה ${quizPos + 1} מתוך ${quizOrder.length}</span>
        <span class="quizScore">⭐ ${quizScore}</span>
      </div>
      <p class="quizQuestion">${item.q}</p>
      <div class="quizOptions">
        ${optOrder.map(i => `<button type="button" class="quizOption" data-idx="${i}">${item.options[i]}</button>`).join("")}
      </div>
    </div>
  `;
}

function handleQuizAnswer(optBtn){
  const item = TRIVIA[quizOrder[quizPos]];
  const chosen = Number(optBtn.dataset.idx);
  const isCorrect = chosen === item.correct;
  if (isCorrect) quizScore++;

  document.querySelectorAll(".quizOption").forEach(b => {
    b.classList.add("disabled");
    const idx = Number(b.dataset.idx);
    if (idx === item.correct) b.classList.add("correct");
    else if (b === optBtn) b.classList.add("wrong");
  });

  const card = document.querySelector(".quizCard");
  if (card){
    const scoreEl = card.querySelector(".quizScore");
    if (scoreEl) scoreEl.textContent = "⭐ " + quizScore;
    const feedback = document.createElement("div");
    feedback.className = "quizFeedback " + (isCorrect ? "correct" : "wrong");
    feedback.textContent = isCorrect ? "🎉 נכון מאוד!" : "❌ לא בדיוק...";
    card.appendChild(feedback);
    const fact = document.createElement("div");
    fact.className = "quizFact";
    fact.textContent = "💡 " + item.fact;
    card.appendChild(fact);
    const isLast = quizPos + 1 >= quizOrder.length;
    const nextBtn = document.createElement("button");
    nextBtn.type = "button";
    nextBtn.className = "quizNextBtn";
    nextBtn.textContent = isLast ? "לתוצאה הסופית 🏁" : "השאלה הבאה ⟵";
    card.appendChild(nextBtn);
  }
}

function renderQuizSummary(){
  const root = document.getElementById("quizRoot");
  if (!root) return;
  const total = quizOrder.length;
  let emoji, msg;
  if (quizScore === total){
    emoji = "🏆"; msg = "מושלם! אתם ממש מומחי פולין!";
  } else if (quizScore >= total * 0.7){
    emoji = "🥳"; msg = "כל הכבוד! אתם מכירים את פולין מצוין.";
  } else if (quizScore >= total * 0.4){
    emoji = "😊"; msg = "יפה מאוד! אחרי הטיול תדעו עוד יותר.";
  } else {
    emoji = "🌟"; msg = "התחלה נהדרת — בואו נגלה עוד בפולין ביחד!";
  }
  root.innerHTML = `
    <div class="quizCard quizSummary">
      <div class="emoji">${emoji}</div>
      <div class="scoreLine">הניקוד שלכם: ${quizScore} מתוך ${total} ⭐</div>
      <div class="msg">${msg}</div>
      <button type="button" class="quizAgainBtn">🔁 לשחק שוב</button>
    </div>
  `;
}

/* ---------- Shekel estimate next to every złoty amount ----------
   Prices stay in złoty (that's what you pay on the spot); each amount gets "(≈₪…)" appended.
   Done on the rendered panel's text nodes after all injections, so the data tables stay in zł
   and only this rate needs updating. Rate: Wise mid-market, October 2026. */
const PLN_ILS = 0.80;
function ilsRound(n){
  const v = n * PLN_ILS;
  return v < 20 ? Math.round(v) : v < 200 ? Math.round(v/5)*5 : Math.round(v/10)*10;
}
function ilsFmt(n){ return ilsRound(n).toLocaleString("en-US"); }
const ZL_RE = /(\d{1,3}(?:,\d{3})*(?:\.\d+)?)(?:\s?[-–]\s?(\d{1,3}(?:,\d{3})*(?:\.\d+)?))?\s?zł/g;
function addShekels(root){
  if (!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    const t = node.nodeValue;
    if (!t.includes("zł")) return;
    const next = node.nextSibling;
    node.nodeValue = t.replace(ZL_RE, (m, a, b, off, str) => {
      if (str.slice(off + m.length, off + m.length + 4).includes("₪")) return m;   // already converted
      const x = parseFloat(a.replace(/,/g, "")), y = b ? parseFloat(b.replace(/,/g, "")) : null;
      return m + ` (≈₪${ilsFmt(x)}${y !== null ? "-" + ilsFmt(y) : ""})`;
    });
  });
}

function selectDay(id){
