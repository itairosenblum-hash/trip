<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אוסטריה למשפחה 2026 — המסלול שלנו</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F5C4E">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#1F5C4E;
    --green-dark:#163F35;
    --green-pop:#2E9370;
    --orange:#B5651D;
    --orange-pop:#E8862E;
    --sky:#2C8FBF;
    --sky-bg:#E7F4FA;
    --cream:#FAF6EE;
    --cream-2:#F2E9DC;
    --ink:#26302C;
    --muted:#6b7570;
    --line:#DDD3C0;
    --red-bg:#FBEBE7;
    --green-bg:#E9F3EE;
    --yellow-bg:#FDF6E3;
    --radius-lg:20px;
    --radius-md:14px;
    --shadow-soft:0 4px 16px rgba(38,48,44,.10);
    --shadow-pop:0 6px 20px rgba(38,48,44,.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Heebo',sans-serif;
    font-weight:400;
    line-height:1.6;
    font-size:15.5px;
  }
  h1,h2,h3{font-family:'Frank Ruhl Libre',serif;margin:0;}
  header.top{
    padding:26px 28px 22px;
    background:
      radial-gradient(circle at 92% -10%, rgba(232,134,46,.16), transparent 55%),
      radial-gradient(circle at 6% 120%, rgba(44,143,191,.14), transparent 50%),
      linear-gradient(180deg,#fff, var(--cream));
    border-bottom:2px solid var(--cream-2);
  }
  header.top .eyebrow{color:var(--orange);font-size:14px;font-weight:700;margin-bottom:4px;letter-spacing:.2px;}
  header.top h1{font-size:32px;color:var(--green-dark);font-weight:700;}
  header.top .sub{color:var(--muted);font-size:14.5px;margin-top:6px;}

  .layout{
    display:flex;
    align-items:flex-start;
    max-width:1280px;
    margin:0 auto;
    padding:22px 28px 60px;
    gap:26px;
  }
  nav.daynav{
    flex:0 0 210px;
    position:sticky;
    top:18px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  nav.daynav button{
    all:unset;
    cursor:pointer;
    padding:12px 14px;
    border-radius:14px;
    font-size:14.5px;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:10px;
    border:2px solid transparent;
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }
  nav.daynav button .icon{font-size:20px;line-height:1;flex:0 0 auto;}
  nav.daynav button .label{display:flex;flex-direction:column;gap:2px;min-width:0;}
  nav.daynav button .d{font-weight:700;color:var(--green-dark);font-size:14px;}
  nav.daynav button .t{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  nav.daynav button:hover{background:#F0EADB;}
  nav.daynav button:active{transform:scale(.97);}
  nav.daynav button.active{background:var(--green);border-color:var(--orange-pop);box-shadow:var(--shadow-pop);}
  nav.daynav button.active .d,nav.daynav button.active .t{color:#fff;}

  main.content{flex:1;min-width:0;}

  .mapCard{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:16px 16px 14px;
    margin-bottom:20px;
    box-shadow:var(--shadow-soft);
  }
  .mapCard .mapTitle{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:6px;
  }
  .mapCard .mapTitle h2{font-size:17px;color:var(--green-dark);}
  .mapCard .mapTitle span{font-size:12.5px;color:var(--muted);}
  .mapEmbedWrap{
    width:100%;
    height:320px;
    border-radius:var(--radius-md);
    overflow:hidden;
    background:var(--cream-2);
    border:1px solid var(--line);
  }
  .mapEmbedWrap iframe{width:100%;height:100%;border:0;display:block;}

  .rowWaze{
    display:inline-flex;align-items:center;justify-content:center;
    width:24px;height:24px;margin-inline-start:8px;
    border-radius:50%;background:var(--sky-bg);
    font-size:13px;text-decoration:none;vertical-align:middle;line-height:1;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .rowWaze:hover{box-shadow:var(--shadow-soft);transform:scale(1.12);}

  .photoGallery{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .photoGallery figure{
    margin:0;flex:1 1 260px;position:relative;
    border-radius:var(--radius-md);overflow:hidden;
    height:190px;
    background:var(--cream-2);
    box-shadow:var(--shadow-soft);
  }
  .photoGallery figure a{display:block;width:100%;height:100%;}
  .photoGallery img{
    width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .3s ease;
  }
  .photoGallery figure:hover img{transform:scale(1.06);}
  .photoGallery figcaption{
    position:absolute;inset-inline-start:0;bottom:0;width:100%;
    background:linear-gradient(0deg, rgba(22,63,53,.78), rgba(22,63,53,0));
    color:#fff;font-size:12.5px;padding:22px 12px 8px;
    text-align:start;
  }

  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px 26px 26px;box-shadow:var(--shadow-soft);}
  .panel .tag{color:var(--orange);font-weight:700;font-size:14.5px;margin-bottom:4px;}
  .panel h2.title{font-size:28px;color:var(--green-dark);margin-bottom:6px;}
  .panel .meta{color:var(--muted);font-size:13.5px;margin-bottom:16px;}

  table.sched{width:100%;border-collapse:collapse;margin-bottom:18px;font-size:14.5px;}
  table.sched td{padding:11px 12px;border-bottom:1px solid #EFE8DA;}
  table.sched td:last-child{width:120px;font-weight:700;background:var(--cream-2);text-align:center;border-radius:10px;}
  table.sched tr:last-child td{border-bottom:none;}

  .sectionLabel{font-family:'Frank Ruhl Libre',serif;font-weight:700;color:var(--green-dark);font-size:16.5px;margin:18px 0 8px;}

  .places{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
  .places .p{font-size:14px;line-height:1.6;}
  .places .p b{color:var(--orange);}

  .boxes{display:flex;gap:14px;margin:16px 0;flex-wrap:wrap;}
  .box{flex:1 1 220px;border-radius:var(--radius-md);padding:14px 16px;font-size:14px;}
  .box b{display:block;margin-bottom:4px;font-size:14px;}
  .box.green{background:var(--green-bg);}
  .box.red{background:var(--red-bg);}
  .box.yellow{background:var(--yellow-bg);}
  .box.tan{background:var(--cream-2);}

  table.kids{width:100%;border-collapse:collapse;font-size:13.8px;margin-bottom:6px;}
  table.kids td{padding:8px 10px;border-bottom:1px solid #EFE8DA;vertical-align:top;}
  table.kids td:last-child{width:150px;background:var(--cream-2);border-radius:8px;font-size:12.8px;color:var(--muted);}

  .footerbar{background:var(--green-dark);color:#fff;padding:13px 16px;border-radius:var(--radius-md);font-size:14px;font-weight:500;margin-top:16px;display:flex;align-items:center;gap:8px;}

  ul.altlist{padding-inline-start:20px;margin:0 0 16px;font-size:14.3px;line-height:1.7;}
  ol.checklist{padding-inline-start:20px;margin:0 0 16px;font-size:14.3px;line-height:1.75;}

  @media (max-width: 860px){
    body{font-size:16px;}
    header.top{padding:20px 18px 18px;}
    header.top h1{font-size:27px;}
    .layout{flex-direction:column;padding:16px 14px 44px;gap:16px;}
    nav.daynav{
      position:static;
      flex-direction:row;
      overflow-x:auto;
      width:100%;
      flex:none;
      gap:8px;
      padding:2px 2px 8px;
      -webkit-overflow-scrolling:touch;
    }
    nav.daynav button{flex:0 0 auto;white-space:nowrap;border:2px solid var(--line);background:#fff;}
    nav.daynav button.active{border-color:var(--orange-pop);}
    nav.daynav button .icon{font-size:22px;}
    .panel{padding:18px 16px 20px;}
    .panel h2.title{font-size:23px;}
    .mapEmbedWrap{height:260px;}
    .boxes{flex-direction:column;}
    .photoGallery figure{height:150px;flex:1 1 45%;}
    table.sched td{padding:12px 10px;font-size:14.5px;}
    .wazeBtn{padding:11px 16px;font-size:14px;}
  }
</style>
</head>

/* ---------- Destination photos (Wikimedia Commons) ---------- */
function wmFile(name, width){
  return "https://commons.wikimedia.org/wiki/Special:FilePath/" + encodeURIComponent(name.replace(/ /g,"_")) + "?width=" + (width||1400);
}
function wmPage(name){
  return "https://commons.wikimedia.org/wiki/File:" + encodeURIComponent(name.replace(/ /g,"_"));
}
const IMAGES = {
  overview: [ {f:"Wagrain.JPG", alt:"Wagrain — בסיס הלינה שלנו"} ],
  d2:  [ {f:"Wien - Stephansdom (3).JPG", alt:"קתדרלת שטפן, וינה"} ],
  d3:  [ {f:"Hallstatt, Austria (37260661934).jpg", alt:"Hallstatt"},
         {f:"Gosaulacke mit Blick zum Dachstein.jpg", alt:"Gosausee מול רכס Dachstein"} ],
  d4:  [ {f:"St.-Johannes-Kirche in Sankt Johann im Pongau.jpg", alt:"St. Johann im Pongau"} ],
  d5:  [ {f:"Hohenwerfen castle.jpg", alt:"מצודת Hohenwerfen"} ],
  d6:  [ {f:"20190624.Kaiser-Franz-Joseph-Höhe, Grossglockner.-047.jpg", alt:"Kaiser-Franz-Josefs-Höhe, Grossglockner"} ],
  d7:  [ {f:"Salzburg Festung Hohensalzburg Blick über Salzburg.jpg", alt:"מצודת Hohensalzburg, זלצבורג"} ],
  d8:  [ {f:"Zell am see zeller see.jpg", alt:"Zell am See"},
         {f:"Stausee Mooserboden Kaprun 01.jpg", alt:"סכר Mooserboden, Kaprun"} ],
  d9:  [ {f:"Melk Abbey (8).jpg", alt:"מנזר Melk"},
         {f:"Stiftskirche Dürnstein 01.JPG", alt:"Dürnstein"} ],
};
function renderGallery(id){
  const imgs = IMAGES[id];
  if(!imgs || !imgs.length) return "";
  return `<div class="photoGallery">${imgs.map(im => `
    <figure>
      <a href="${wmPage(im.f)}" target="_blank" rel="noopener">
        <img src="${wmFile(im.f)}" alt="${im.alt}" loading="lazy"
             onerror="this.closest('figure').style.display='none'">
      </a>
      <figcaption>${im.alt}</figcaption>
    </figure>`).join("")}</div>`;
}

/* ---------- Map (Google Maps, no key) + Waze navigation ---------- */
const DAY_ICON = {
  overview:"🗺️", d1:"✈️", d2:"🏛️", d3:"🏞️", d4:"🎢", d5:"🏰",
  d6:"🏔️", d7:"🎻", d8:"🚡", d9:"⛪", d10:"✈️", alt:"📋",
};
const LOC_ICON = {
  airport:"✈️", vienna:"🏛️", wagrain:"🏡", hallstatt:"🏘️", gosausee:"🏞️",
  alpendorf:"🎢", werfen:"🏰", werfenweng:"🏞️", glockner:"🏔️",
  salzburg:"🏰", zell:"🚡", kaprun:"💧", melk:"⛪", durnstein:"⛪",
};

function embedUrlFor(segment){
  const keys = [...new Set(segment.length ? segment : FULL_ROUTE)];
  const lats = keys.map(k=>LOC[k].lat), lons = keys.map(k=>LOC[k].lon);
  const latC = (Math.min(...lats)+Math.max(...lats))/2;
  const lonC = (Math.min(...lons)+Math.max(...lons))/2;
  const span = Math.max(Math.max(...lats)-Math.min(...lats), Math.max(...lons)-Math.min(...lons));
  let z = 13;
  if (span > 3) z = 7;
  else if (span > 1.2) z = 9;
  else if (span > 0.4) z = 10;
  else if (span > 0.15) z = 11;
  return `https://maps.google.com/maps?q=${latC.toFixed(4)},${lonC.toFixed(4)}&z=${z}&output=embed`;
}

function wazeLink(k){
  const loc = LOC[k];
  if (loc.address){
    return `https://waze.com/ul?q=${encodeURIComponent(loc.address)}&navigate=yes`;
  }
  return `https://waze.com/ul?ll=${loc.lat}%2C${loc.lon}&navigate=yes`;
}

/* Per-day map of [substring appearing in a schedule row's first cell -> LOC key],
   used to attach an inline Waze button to the specific row that marks arrival/start
   at that destination. Substrings are exact fragments of the existing row text. */
const ROW_WAZE = {
  d1: [ ["נחיתה ואיסוף מזוודות","airport"], ["לילה: MOXY Vienna Airport","airport"] ],
  d2: [ ["יציאה למרכז וינה","vienna"], ["יציאה ל-Wagrain","wagrain"], ["צ׳ק-אין, סופר והתארגנות","wagrain"] ],
  d3: [ ["Hallstatt: כפר","hallstatt"], ["Gosausee והליכה קלה","gosausee"], ["חזרה ל-Wagrain","wagrain"] ],
  d4: [ ["הגעה ל-Alpendorf","alpendorf"], ["St. Johann: מרכז עתיק","alpendorf"], ["חזרה ל-Wagrain","wagrain"] ],
  d5: [ ["חניה ועלייה במעלית לטירה","werfen"], ["Werfenweng: אגם Wengsee","werfenweng"], ["חזרה ל-Wagrain","wagrain"] ],
  d6: [ ["תצפית הקרחון ב-Kaiser Franz Josef Höhe","glockner"], ["Wagrain","wagrain"] ],
  d7: [ ["הגעה וחניה במרכז","salzburg"] ],
  d8: [ ["הגעה ל-Zell am See","zell"], ["חזרה ל-Wagrain","wagrain"], ["חניה בחניון החינמי ליד קופת Kesselfall","kaprun"] ],
  d9: [ ["הגעה ל-Melk","melk"], ["נסיעה לאורך Wachau ל-Dürnstein","durnstein"], ["יציאה לשדה התעופה","airport"], ["MOXY, החזרת רכב ואריזה","airport"] ],
};

function injectRowWaze(id){
  const rules = ROW_WAZE[id];
  if(!rules) return;
  panelEl.querySelectorAll("table.sched td:first-child").forEach(td=>{
    const text = td.textContent;
    const rule = rules.find(([sub])=> text.includes(sub));
    if(!rule) return;
    const [, locKey] = rule;
    const a = document.createElement("a");
    a.href = wazeLink(locKey);
    a.target = "_blank";
    a.rel = "noopener";
    a.className = "rowWaze";
    a.title = "נווט ב-Waze ל-" + LOC[locKey].label;
    a.textContent = "🧭";
    td.appendChild(a);
  });
}

/* ---------- Nav + panel rendering ---------- */
const navEl = document.getElementById("daynav");
const panelEl = document.getElementById("panel");
const mapTitleEl = document.getElementById("mapTitle");
const mapSubEl = document.getElementById("mapSub");
const mapFrameEl = document.getElementById("mapFrame");

DAYS.forEach((d,i)=>{
  const btn = document.createElement("button");
  btn.id = "nav-"+d.id;
  btn.innerHTML = `<span class="icon">${DAY_ICON[d.id]||"📍"}</span><span class="label"><span class="d">${d.nav}</span><span class="t">${d.navSub}</span></span>`;
  btn.addEventListener("click", ()=> selectDay(d.id));
  navEl.appendChild(btn);
});

/* ---------- Auto-open today's day during the trip ---------- */
const DAY_DATES = {
  d1:"2026-09-24", d2:"2026-09-25", d3:"2026-09-26", d4:"2026-09-27", d5:"2026-09-28",
  d6:"2026-09-29", d7:"2026-09-30", d8:"2026-10-01", d9:"2026-10-02", d10:"2026-10-03",
};
function todaysDayId(){
  const now = new Date();
  const y = now.getFullYear(), m = String(now.getMonth()+1).padStart(2,"0"), dd = String(now.getDate()).padStart(2,"0");
  const todayStr = `${y}-${m}-${dd}`;
  for (const id in DAY_DATES){
    if (DAY_DATES[id] === todayStr) return id;
  }
  return null;
}

function selectDay(id){
  const day = DAYS.find(d=>d.id===id);
  if(!day) return;
  panelEl.innerHTML = renderGallery(id) + day.render();
  injectRowWaze(id);
  document.querySelectorAll("nav.daynav button").forEach(b=>b.classList.remove("active"));
  document.getElementById("nav-"+id).classList.add("active");
  const isOverview = (id === "overview" || id === "alt");
  const segment = day.segment.length ? day.segment : FULL_ROUTE;

  mapFrameEl.src = embedUrlFor(segment);
  mapTitleEl.textContent = (DAY_ICON[id]||"🗺️") + " מפה — " + day.nav;
  mapSubEl.textContent = isOverview ? "כל המסלול" : "ממורכזת אוטומטית ביעד היום";
  window.scrollTo({top:0, behavior:"smooth"});
}

selectDay(todaysDayId() || "overview");

if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
