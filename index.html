<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אוסטריה למשפחה 2026 — המסלול שלנו</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8A0E22">
<link rel="icon" href="icons/icon-192.png?v=5">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="אוסטריה 2026">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --red:#C8102E;
    --red-dark:#8A0E22;
    --red-pop:#E63950;
    --red-soft:#FBEAEC;
    --gold:#C89B3C;
    --gold-dark:#8f6d24;
    --gold-soft:#FBF3E1;
    --cream:#FFFFFF;
    --cream-2:#FBEEEF;
    --ink:#2B2320;
    --muted:#78706c;
    --line:#EFE1E1;
    --red-bg:#FBEAEC;
    --green-bg:#EFF6EC;
    --green-txt:#3d7a3f;
    --yellow-bg:#FDF6E3;
    --radius-lg:20px;
    --radius-md:14px;
    --shadow-soft:0 4px 16px rgba(43,35,32,.09);
    --shadow-pop:0 6px 20px rgba(43,35,32,.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Heebo',sans-serif;
    font-weight:400;
    line-height:1.6;
    font-size:15.5px;
  }
  h1,h2,h3{font-family:'Frank Ruhl Libre',serif;margin:0;}
  header.top{
    padding:26px 28px 22px;
    background:
      radial-gradient(circle at 92% -10%, rgba(200,16,46,.10), transparent 55%),
      radial-gradient(circle at 6% 120%, rgba(200,155,60,.14), transparent 50%),
      linear-gradient(180deg,#fff, #FFFAF9);
    border-bottom:3px solid var(--red);
  }
  header.top .eyebrow{color:var(--red);font-size:14px;font-weight:700;margin-bottom:4px;letter-spacing:.2px;}
  header.top h1{font-size:32px;color:var(--red-dark);font-weight:700;}
  header.top .sub{color:var(--muted);font-size:14.5px;margin-top:6px;}

  .layout{
    display:flex;
    align-items:flex-start;
    max-width:1280px;
    margin:0 auto;
    padding:22px 28px 60px;
    gap:26px;
  }
  nav.daynav{
    flex:0 0 210px;
    position:sticky;
    top:18px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  nav.daynav button{
    all:unset;
    cursor:pointer;
    padding:12px 14px;
    border-radius:14px;
    font-size:14.5px;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:10px;
    border:2px solid transparent;
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }
  nav.daynav button .icon{font-size:20px;line-height:1;flex:0 0 auto;}
  nav.daynav button .label{display:flex;flex-direction:column;gap:2px;min-width:0;}
  nav.daynav button{position:relative;}
  nav.daynav button .d{font-weight:700;color:var(--red-dark);font-size:14px;}
  nav.daynav button .t{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  nav.daynav button:hover{background:var(--cream-2);}
  nav.daynav button:active{transform:scale(.97);}
  nav.daynav button.active{background:var(--red-dark);border-color:var(--gold);box-shadow:var(--shadow-pop);}
  nav.daynav button.active .d,nav.daynav button.active .t{color:#fff;}
  nav.daynav button.isToday:not(.active){border-color:var(--gold);}
  nav.daynav button .todayDot{
    position:absolute;top:6px;inset-inline-end:6px;
    background:var(--gold);color:#fff;font-size:9.5px;font-weight:800;
    padding:1px 6px;border-radius:999px;letter-spacing:.3px;
  }

  main.content{flex:1;min-width:0;}

  .nowBar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:linear-gradient(135deg, var(--gold-dark), var(--gold));
    color:#fff;border-radius:var(--radius-lg);
    padding:14px 18px;margin-bottom:16px;
    box-shadow:var(--shadow-pop);
  }
  .nowBar[hidden]{display:none;}
  .nowBar-text{display:flex;flex-direction:column;gap:2px;}
  .nowBar-label{font-size:12px;font-weight:700;opacity:.9;letter-spacing:.2px;}
  .nowBar-place{font-size:18px;font-weight:800;font-family:'Frank Ruhl Libre',serif;}
  .nowBar-btn{
    background:#fff;color:var(--gold-dark);text-decoration:none;
    font-weight:800;font-size:14.5px;padding:11px 20px;border-radius:999px;
    white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.15);
    transition:transform .12s ease;
  }
  .nowBar-btn:hover{transform:translateY(-1px) scale(1.02);}

  .installBanner{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:linear-gradient(135deg, var(--red-dark), var(--red));
    color:#fff;padding:10px 24px;font-size:14px;
  }
  .installBanner[hidden]{display:none;}
  .installBanner-icon{font-size:19px;line-height:1;}
  .installBanner-text{flex:1;min-width:200px;}
  .installBanner-btn{
    background:#fff;color:var(--red-dark);border:none;font-weight:800;
    padding:8px 18px;border-radius:999px;cursor:pointer;font-size:13.5px;
    white-space:nowrap;transition:transform .12s ease;
  }
  .installBanner-btn:hover{transform:scale(1.04);}
  .installBanner-btn[hidden]{display:none;}
  .installBanner-close{
    background:transparent;border:none;color:#fff;font-size:16px;cursor:pointer;
    opacity:.85;padding:4px 6px;line-height:1;
  }
  .installBanner-close:hover{opacity:1;}

  .weatherCard{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);
    padding:12px 16px;margin-bottom:20px;box-shadow:var(--shadow-soft);
    font-size:14px;
  }
  .weatherCard[hidden]{display:none;}
  .weatherIcon{font-size:26px;line-height:1;}
  .weatherTemps{font-weight:700;color:var(--ink);}
  .weatherTemps b{color:var(--red-dark);font-size:16.5px;}
  .weatherRain{color:#3d7a9e;font-weight:600;}
  .weatherLoc{margin-inline-start:auto;color:var(--muted);font-size:12.5px;}
  .weatherLoading,.weatherNA{color:var(--muted);font-size:13px;}

  .waFab{
    position:fixed;bottom:22px;left:22px;z-index:500;
    width:56px;height:56px;border-radius:50%;
    background:#25D366;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 16px rgba(0,0,0,.28);
    transition:transform .15s ease;
  }
  .waFab:hover{transform:scale(1.08);}
  .waFab svg{width:28px;height:28px;fill:#fff;}

  .mapCard{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:16px 16px 14px;
    margin-bottom:20px;
    box-shadow:var(--shadow-soft);
  }
  .mapCard .mapTitle{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:6px;
  }
  .mapCard .mapTitle h2{font-size:17px;color:var(--red-dark);}
  .mapCard .mapTitle span{font-size:12.5px;color:var(--muted);}
  #mapDiv{
    width:100%;
    height:340px;
    border-radius:var(--radius-md);
    overflow:hidden;
    direction:ltr;
    background:var(--cream-2);
  }
  .map-marker{
    width:12px;height:12px;border-radius:50%;
    background:#cbb9ba;border:2px solid #fff;
    box-shadow:0 1px 3px rgba(0,0,0,.35);
    transition:all .15s ease;
  }
  .map-marker.active{
    width:17px;height:17px;
    background:var(--red);
    margin:-2.5px 0 0 -2.5px;
  }
  .map-marker.base{
    width:0;height:0;
    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-bottom:14px solid var(--red-dark);
    background:none;border-width:0;box-shadow:none;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));
  }
  .leaflet-tooltip.map-tooltip{
    direction:ltr;text-align:left;
    font-family:'Heebo',sans-serif;
    font-size:12px;
    color:var(--ink);
    background:#fff;
    border:1px solid var(--line);
    box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  .leaflet-tooltip.map-tooltip.base-tooltip{font-weight:700;color:var(--red-dark);}
  .leaflet-tooltip.map-tooltip.active-tooltip{font-weight:700;color:var(--red-dark);}

  .rowWaze{
    display:inline-flex;align-items:center;justify-content:center;
    width:24px;height:24px;margin-inline-start:8px;
    border-radius:50%;background:var(--gold-soft);
    font-size:13px;text-decoration:none;vertical-align:middle;line-height:1;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .rowWaze:hover{box-shadow:var(--shadow-soft);transform:scale(1.12);}

  .photoGallery{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .photoGallery figure{
    margin:0;flex:1 1 260px;position:relative;
    border-radius:var(--radius-md);overflow:hidden;
    height:190px;
    background:var(--cream-2);
    box-shadow:var(--shadow-soft);
  }
  .photoGallery figure a{display:block;width:100%;height:100%;}
  .photoGallery img{
    width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .3s ease;
  }
  .photoGallery figure:hover img{transform:scale(1.06);}
  .photoGallery figcaption{
    position:absolute;inset-inline-start:0;bottom:0;width:100%;
    background:linear-gradient(0deg, rgba(60,20,24,.80), rgba(60,20,24,0));
    color:#fff;font-size:12.5px;padding:22px 12px 8px;
    text-align:start;
  }

  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px 26px 26px;box-shadow:var(--shadow-soft);}
  .panel .tag{color:var(--red);font-weight:700;font-size:14.5px;margin-bottom:4px;}
  .panel h2.title{font-size:28px;color:var(--red-dark);margin-bottom:6px;}
  .panel .meta{color:var(--muted);font-size:13.5px;margin-bottom:16px;}

  table.sched{width:100%;border-collapse:collapse;margin-bottom:18px;font-size:14.5px;}
  table.sched td{padding:11px 12px;border-bottom:1px solid #F3E7E7;}
  table.sched td:last-child{width:120px;font-weight:700;background:var(--cream-2);text-align:center;border-radius:10px;color:var(--red-dark);}
  table.sched tr:last-child td{border-bottom:none;}

  .sectionLabel{font-family:'Frank Ruhl Libre',serif;font-weight:700;color:var(--red-dark);font-size:16.5px;margin:18px 0 8px;}

  .places{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
  .places .p{font-size:14px;line-height:1.6;}
  .places .p b{color:var(--red);}

  .boxes{display:flex;gap:14px;margin:16px 0;flex-wrap:wrap;}
  .box{flex:1 1 220px;border-radius:var(--radius-md);padding:14px 16px;font-size:14px;}
  .box b{display:block;margin-bottom:4px;font-size:14px;}
  .box.green{background:var(--gold-soft);}
  .box.green b{color:var(--gold-dark);}
  .box.red{background:var(--red-soft);}
  .box.red b{color:var(--red-dark);}
  .box.yellow{background:var(--yellow-bg);}
  .box.tan{background:var(--cream-2);}

  table.kids{width:100%;border-collapse:collapse;font-size:13.8px;margin-bottom:6px;}
  table.kids td{padding:8px 10px;border-bottom:1px solid #F3E7E7;vertical-align:top;}
  table.kids td:last-child{width:150px;background:var(--cream-2);border-radius:8px;font-size:12.8px;color:var(--muted);}

  .footerbar{background:var(--red-dark);color:#fff;padding:13px 16px;border-radius:var(--radius-md);font-size:14px;font-weight:500;margin-top:16px;display:flex;align-items:center;gap:8px;}

  ul.altlist{padding-inline-start:20px;margin:0 0 16px;font-size:14.3px;line-height:1.7;}
  ol.checklist{padding-inline-start:20px;margin:0 0 16px;font-size:14.3px;line-height:1.75;}

  @media (max-width: 860px){
    body{font-size:16px;}
    header.top{padding:20px 18px 18px;}
    header.top h1{font-size:27px;}
    .layout{flex-direction:column;padding:16px 14px 44px;gap:16px;}
    nav.daynav{
      position:static;
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      width:100%;
      flex:none;
      gap:8px;
    }
    nav.daynav button{
      flex-direction:column;justify-content:center;text-align:center;gap:4px;
      border:2px solid var(--line);background:#fff;padding:10px 6px;min-height:64px;
    }
    nav.daynav button .label{align-items:center;}
    nav.daynav button .t{white-space:normal;text-overflow:clip;line-height:1.25;}
    nav.daynav button.active{border-color:var(--gold);}
    nav.daynav button .icon{font-size:22px;}
    nav.daynav button .todayDot{top:4px;inset-inline-end:4px;}
    .nowBar{padding:12px 14px;}
    .nowBar-place{font-size:16px;}
    .installBanner{padding:9px 14px;font-size:13px;}
    .installBanner-text{min-width:0;}
    .weatherCard{padding:10px 14px;font-size:13.5px;gap:10px;}
    .weatherLoc{font-size:12px;}
    .waFab{width:50px;height:50px;bottom:16px;left:16px;}
    .waFab svg{width:24px;height:24px;}
    .panel{padding:18px 16px 20px;}
    .panel h2.title{font-size:23px;}
    #mapDiv{height:260px;}
    .boxes{flex-direction:column;}
    .photoGallery figure{height:150px;flex:1 1 45%;}
    table.sched td{padding:12px 10px;font-size:14.5px;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="eyebrow">החופשה המשפחתית שלנו • ספטמבר–אוקטובר 2026</div>
  <h1>🏔️ אוסטריה למשפחה</h1>
</header>

<div class="installBanner" id="installBanner" hidden>
  <span class="installBanner-icon">📲</span>
  <span class="installBanner-text" id="installBannerText">התקינו את האתר כאפליקציה למסך הבית — גישה מהירה גם בלי אינטרנט</span>
  <button class="installBanner-btn" id="installBannerBtn" type="button">התקן</button>

      <div class="mapTitle">
        <h2 id="mapTitle">🗺️ מפת היום</h2>
        <span id="mapSub">ממורכזת אוטומטית ביעד היום</span>
      </div>
      <div id="mapDiv"></div>
    </div>
    <div class="weatherCard" id="weatherCard" hidden></div>
    <div class="panel" id="panel"></div>

</div>

  <svg viewBox="0 0 448 512" aria-hidden="true"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.7z"/></svg>

<script>
/* ---------- Coordinates ---------- */
const LOC = {
  airport:   {lat:48.1103, lon:16.5697, label:"שדה התעופה / MOXY", address:"Moxy Vienna Airport, Ausfahrtsstraße 4, 1300 Wien, אוסטריה"},
  vienna:    {lat:48.2082, lon:16.3738, label:"וינה (מרכז העיר)"},
  wagrain:   {lat:47.3400, lon:13.3000, label:"Wagrain (בסיס)", address:"Appartements Schattauer, Markt 164, 5602 Wagrain, אוסטריה"},
  hallstatt: {lat:47.5622, lon:13.6493, label:"Hallstatt"},
  gosausee:  {lat:47.5386, lon:13.5461, label:"Gosausee"},
  alpendorf: {lat:47.3500, lon:13.2000, label:"Alpendorf / St. Johann"},
  werfen:    {lat:47.4772, lon:13.1889, label:"Hohenwerfen"},
  werfenweng:{lat:47.4333, lon:13.2167, label:"Werfenweng"},
  glockner:  {lat:47.0725, lon:12.8319, label:"Kaiser-Franz-Josefs-Höhe"},
  salzburg:  {lat:47.8095, lon:13.0550, label:"Salzburg"},
  zell:      {lat:47.3239, lon:12.7958, label:"Zell am See"},
  kaprun:    {lat:47.2711, lon:12.7561, label:"Kaprun"},
  melk:      {lat:48.2333, lon:15.3333, label:"Melk"},
  durnstein: {lat:48.3958, lon:15.5183, label:"Dürnstein"},
};
const FULL_ROUTE = ["airport","vienna","wagrain","hallstatt","gosausee","wagrain","alpendorf","wagrain",
  "werfen","werfenweng","wagrain","glockner","wagrain","salzburg","wagrain",
  "zell","kaprun","zell","wagrain","melk","durnstein","airport"];

/* ---------- Day content ---------- */
const DAYS = [
{
  id:"overview", nav:"מבט על", navSub:"כל הטיול",
  segment: FULL_ROUTE,
  render: () => `
    <div class="tag">מבט על</div>
    <h2 class="title">כל הטיול בעמוד אחד</h2>
    <table class="sched">
      ${[
        ["24.9 — טיסה לוינה","קל"],
        ["25.9 — וינה ל-Wagrain","בינוני"],
        ["26.9 — Hallstatt + Gosausee","בינוני"],
        ["27.9 (הורחב) — Geisterberg + St. Johann","בינוני"],
        ["28.9 (הורחב) — Hohenwerfen + Werfenweng","בינוני"],
        ["29.9 — Grossglockner","ארוך"],
        ["30.9 — Salzburg","בינוני"],
        ["1.10 — Zell am See + Schmittenhöhe (+ תוספת Kaprun)","בינוני"],
        ["2.10 (הורחב) — Melk + Dürnstein → Airport","בינוני"],
        ["3.10 — טיסה הביתה","קל"],
      ].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}
    </table>

    const rain = d.precipitation_probability_max[0];
    card.innerHTML = `
      <span class="weatherIcon">${weatherEmoji(code)}</span>
      <span class="weatherTemps"><b>${max}°</b> / ${min}°</span>
      <span class="weatherRain">🌧️ ${rain}%</span>
      <span class="weatherLoc">${LOC[locKey].label}</span>
    `;
  } catch(e){
    if (mySeq !== weatherSeq) return;
    card.innerHTML = `<span class="weatherNA">מזג האוויר לא נטען כרגע — שאר האתר פועל כרגיל.</span>`;
  }
}

/* ---------- Leaflet map: full route (muted) + today's highlighted segment ---------- */
let leafletMap = null;
let mapLayers = []; // markers/polylines currently on the map, cleared+rebuilt on each render

function initMap(){
  if (typeof L === "undefined"){
    document.getElementById("mapDiv").innerHTML =
      '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:13px;padding:12px;text-align:center;">המפה לא נטענה (בעיית רשת) — שאר האתר פועל כרגיל.</div>';
    return;
  }
  leafletMap = L.map("mapDiv", {scrollWheelZoom:false});
  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
    subdomains:"abcd",
    maxZoom:19,
    attribution:"© CARTO © OpenStreetMap contributors"
  }).addTo(leafletMap);
}

function updateMap(segment, isOverview){
  if (!leafletMap) return;
  mapLayers.forEach(l=>leafletMap.removeLayer(l));
  mapLayers = [];

  // Full route, muted dashed line, always shown as context.
  const fullLatLngs = FULL_ROUTE.map(k=>[LOC[k].lat, LOC[k].lon]);
  const fullLine = L.polyline(fullLatLngs, {color:"#cbb9ba", weight:3, dashArray:"2,8", opacity:.8}).addTo(leafletMap);
  mapLayers.push(fullLine);

  // Today's segment, highlighted solid red line.
  const keys = segment.length ? segment : FULL_ROUTE;
  if (!isOverview && keys.length > 1){
    const segLatLngs = keys.map(k=>[LOC[k].lat, LOC[k].lon]);
    const segLine = L.polyline(segLatLngs, {color:"#C8102E", weight:5, opacity:.9}).addTo(leafletMap);
    mapLayers.push(segLine);
  }

  // Markers: Wagrain (home base) gets a pin shape; today's other stops are highlighted red dots;
  // in overview mode all stops are plain muted dots.
  const uniqueKeys = [...new Set(keys)];
  uniqueKeys.forEach(k=>{
    const loc = LOC[k];
    const isBase = (k === "wagrain");
    const isActive = !isOverview && !isBase;
    const cls = isBase ? "map-marker base" : (isActive ? "map-marker active" : "map-marker");
    const size = isBase ? [18,14] : (isActive ? [17,17] : [12,12]);
    const anchor = isBase ? [9,14] : (isActive ? [9,9] : [6,6]);
    const icon = L.divIcon({className:"", html:`<div class="${cls}"></div>`, iconSize:size, iconAnchor:anchor});
    const marker = L.marker([loc.lat, loc.lon], {icon}).addTo(leafletMap);
    const tClass = "map-tooltip" + (isBase ? " base-tooltip" : (isActive ? " active-tooltip" : ""));
    marker.bindTooltip(loc.label, {className:tClass, direction:"top", offset:[0,-10]});
    mapLayers.push(marker);
  });

  // Fit bounds to the relevant set of points.
  const boundsKeys = isOverview ? FULL_ROUTE : uniqueKeys;
  const bounds = L.latLngBounds(boundsKeys.map(k=>[LOC[k].lat, LOC[k].lon]));
  leafletMap.fitBounds(bounds, {padding:[30,30], maxZoom: isOverview ? 9 : 12});
  setTimeout(()=>leafletMap.invalidateSize(), 50);
}

function wazeLink(k){
  const loc = LOC[k];
  if (loc.address){
    return `https://waze.com/ul?q=${encodeURIComponent(loc.address)}&navigate=yes`;
  }
  return `https://waze.com/ul?ll=${loc.lat}%2C${loc.lon}&navigate=yes`;
}

/* Per-day map of [substring appearing in a schedule row's first cell -> LOC key],
   used to attach an inline Waze button to the specific row that marks arrival/start
   at that destination. Substrings are exact fragments of the existing row text. */
const ROW_WAZE = {
  d1: [ ["נחיתה ואיסוף מזוודות","airport"], ["לילה: MOXY Vienna Airport","airport"] ],
  d2: [ ["יציאה למרכז וינה","vienna"], ["יציאה ל-Wagrain","wagrain"], ["צ׳ק-אין, סופר והתארגנות","wagrain"] ],
  d3: [ ["Hallstatt: כפר","hallstatt"], ["Gosausee והליכה קלה","gosausee"], ["חזרה ל-Wagrain","wagrain"] ],
  d4: [ ["הגעה ל-Alpendorf","alpendorf"], ["St. Johann: מרכז עתיק","alpendorf"], ["חזרה ל-Wagrain","wagrain"] ],
  d5: [ ["חניה ועלייה במעלית לטירה","werfen"], ["Werfenweng: אגם Wengsee","werfenweng"], ["חזרה ל-Wagrain","wagrain"] ],
  d6: [ ["תצפית הקרחון ב-Kaiser Franz Josef Höhe","glockner"], ["Wagrain","wagrain"] ],
  d7: [ ["הגעה וחניה במרכז","salzburg"] ],
  d8: [ ["הגעה ל-Zell am See","zell"], ["חזרה ל-Wagrain","wagrain"], ["חניה בחניון החינמי ליד קופת Kesselfall","kaprun"] ],
  d9: [ ["הגעה ל-Melk","melk"], ["נסיעה לאורך Wachau ל-Dürnstein","durnstein"], ["יציאה לשדה התעופה","airport"], ["MOXY, החזרת רכב ואריזה","airport"] ],
};

function injectRowWaze(id){
  const rules = ROW_WAZE[id];
  if(!rules) return;
  panelEl.querySelectorAll("table.sched td:first-child").forEach(td=>{
    const text = td.textContent;
    const rule = rules.find(([sub])=> text.includes(sub));
    if(!rule) return;
    const [, locKey] = rule;
    const a = document.createElement("a");
    a.href = wazeLink(locKey);
    a.target = "_blank";
    a.rel = "noopener";
    a.className = "rowWaze";
    a.title = "נווט ב-Waze ל-" + LOC[locKey].label;
    a.textContent = "🧭";
    td.appendChild(a);
  });
}

/* ---------- Smart Waze target: reads today's schedule + the clock, and figures out
   which point on today's route makes sense to navigate to right now. ---------- */
function parseTimeToMinutes(text){
  const m = text.match(/(\d{1,2}):(\d{2})/);
  if(!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}

function getRowTimes(id){
  const rules = ROW_WAZE[id];
  if(!rules) return [];
  const day = DAYS.find(d=>d.id===id);
  if(!day) return [];
  const tmp = document.createElement("div");
  tmp.innerHTML = day.render();
  const out = [];
  tmp.querySelectorAll("table.sched tr").forEach(tr=>{
    const tds = tr.querySelectorAll("td");
    if(tds.length < 2) return;
    const text = tds[0].textContent;
    const rule = rules.find(([sub])=> text.includes(sub));
    if(!rule) return;
    const [, locKey] = rule;
    out.push({loc:locKey, label:text.split("—")[0].trim(), minutes: parseTimeToMinutes(tds[1].textContent)});
  });
  return out;
}

function getSmartTarget(id){
  const rows = getRowTimes(id);
  if(!rows.length) return null;
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  // rows are already in schedule (chronological) order — pick the first one that hasn't
  // happened yet; if the whole day already passed, fall back to the last stop (usually the hotel).
  const upcoming = rows.find(r => r.minutes === null || r.minutes >= nowMin);
  return upcoming || rows[rows.length - 1];
}

function updateNowBar(viewingId){
  const bar = document.getElementById("nowBar");
  const today = todaysDayId();
  if (!today || viewingId !== today){
    bar.hidden = true;
    return;
  }
  const target = getSmartTarget(today);
  if (!target){
    bar.hidden = true;
    return;
  }
  bar.hidden = false;
  document.getElementById("nowBarLabel").textContent = "🧭 עכשיו בלו״ז: " + target.label;
  document.getElementById("nowBarPlace").textContent = LOC[target.loc].label;
  document.getElementById("nowBarBtn").href = wazeLink(target.loc);
}

/* ---------- Nav + panel rendering ---------- */
const navEl = document.getElementById("daynav");
const panelEl = document.getElementById("panel");
const mapTitleEl = document.getElementById("mapTitle");
const mapSubEl = document.getElementById("mapSub");

/* ---------- Auto-open today's day during the trip ---------- */
const DAY_DATES = {
  d1:"2026-09-24", d2:"2026-09-25", d3:"2026-09-26", d4:"2026-09-27", d5:"2026-09-28",
  d6:"2026-09-29", d7:"2026-09-30", d8:"2026-10-01", d9:"2026-10-02", d10:"2026-10-03",
};
function todaysDayId(){
  const now = new Date();
  const y = now.getFullYear(), m = String(now.getMonth()+1).padStart(2,"0"), dd = String(now.getDate()).padStart(2,"0");
  const todayStr = `${y}-${m}-${dd}`;
  for (const id in DAY_DATES){
    if (DAY_DATES[id] === todayStr) return id;
  }
  return null;
}
const TODAY_ID = todaysDayId();

DAYS.forEach((d,i)=>{
  const btn = document.createElement("button");
  btn.id = "nav-"+d.id;
  const isToday = (d.id === TODAY_ID);
  if (isToday) btn.classList.add("isToday");
  btn.innerHTML = `<span class="icon">${DAY_ICON[d.id]||"📍"}</span><span class="label"><span class="d">${d.nav}</span><span class="t">${d.navSub}</span></span>${isToday ? '<span class="todayDot">היום</span>' : ''}`;
  btn.addEventListener("click", ()=> selectDay(d.id));
  navEl.appendChild(btn);
});

function selectDay(id){
  const day = DAYS.find(d=>d.id===id);
  if(!day) return;
  panelEl.innerHTML = renderGallery(id) + day.render();
  injectRowWaze(id);
  document.querySelectorAll("nav.daynav button").forEach(b=>b.classList.remove("active"));
  document.getElementById("nav-"+id).classList.add("active");
  const isOverview = (id === "overview" || id === "alt");
  const segment = day.segment.length ? day.segment : FULL_ROUTE;

  try { updateMap(segment, isOverview); } catch(e) { console.error("map update failed", e); }
  updateNowBar(id);
  injectWeather(id);
  mapTitleEl.textContent = (DAY_ICON[id]||"🗺️") + " מפה — " + day.nav;
  mapSubEl.textContent = isOverview ? "כל המסלול" : "ממורכזת אוטומטית ביעד היום";
  window.scrollTo({top:0, behavior:"smooth"});
}

try { initMap(); } catch(e) { console.error("map init failed", e); }
selectDay(TODAY_ID || "overview");

/* ---------- PWA auto-refresh: every time the app is opened/foregrounded, actively
   check for a newer version and, if one takes over, reload automatically so the
   visitor never has to manually clear the cache. ---------- */
if ("serviceWorker" in navigator){
  // Only auto-reload on a REAL update (a newer service worker replacing one that was
  // already controlling this page) — not on the very first install, where the first
  // "controllerchange" just means the page has a controller for the first time.
  let hadController = !!navigator.serviceWorker.controller;

  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((reg) => {
      // Re-check for a new version every time the app is opened or comes back to the foreground.
      reg.update().catch(()=>{});
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") reg.update().catch(()=>{});
      });
    }).catch(()=>{});
  });

  let swRefreshed = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController){ hadController = true; return; }
    if (swRefreshed) return;
    swRefreshed = true;
    window.location.reload();
  });
}

/* ---------- Install prompt: proactively offer to install the app, instead of
   relying on the visitor to find the option in the browser menu themselves. ---------- */
(function(){
  const DISMISS_KEY = "austria_install_dismissed_v1";
  const banner = document.getElementById("installBanner");
  const textEl = document.getElementById("installBannerText");
  const btnEl = document.getElementById("installBannerBtn");
  const closeEl = document.getElementById("installBannerClose");
  let deferredPrompt = null;

  function isStandalone(){
    return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  }
  function isIOS(){
    const ua = window.navigator.userAgent;
    const iOSDevice = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    const iPadOS13Plus = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
    return iOSDevice || iPadOS13Plus;
  }
  function dismissed(){
    try { return localStorage.getItem(DISMISS_KEY) === "1"; } catch(e){ return false; }
  }

  function show(mode){
    if (!banner || isStandalone() || dismissed()) return;
    if (mode === "ios"){
      textEl.textContent = "התקינו את האתר כאפליקציה: הקישו שיתוף ⬆️ ואז \"הוסף למסך הבית\"";
      btnEl.hidden = true;
    } else {
      textEl.textContent = "התקינו את האתר כאפליקציה למסך הבית — גישה מהירה גם בלי אינטרנט";
      btnEl.hidden = false;
    }
    banner.hidden = false;
  }
  function hide(){
    if (banner) banner.hidden = true;
  }

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    show("android");
  });

  window.addEventListener("appinstalled", () => {
    hide();
    try { localStorage.setItem(DISMISS_KEY, "1"); } catch(e){}
  });

  btnEl && btnEl.addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    try { await deferredPrompt.userChoice; } catch(e){}
    deferredPrompt = null;
    hide();
  });

  closeEl && closeEl.addEventListener("click", () => {
    hide();
    try { localStorage.setItem(DISMISS_KEY, "1"); } catch(e){}
  });

  if (isIOS() && !isStandalone() && !dismissed()){
    setTimeout(() => show("ios"), 1500);
  }
})();
</script>
