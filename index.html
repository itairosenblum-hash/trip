<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הטיולים שלנו</title>

<meta property="og:type" content="website">
<meta property="og:url" content="https://itairosenblum-hash.github.io/trip/">
<meta property="og:title" content="✈️ הטיולים שלנו">
<meta property="og:description" content="כל הטיולים המשפחתיים שלנו במקום אחד — הטיול הבא וארכיון הטיולים שעשינו.">
<meta property="og:image" content="https://itairosenblum-hash.github.io/trip/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="he_IL">
<meta name="twitter:card" content="summary_large_image">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8A0E22">
<link rel="icon" href="icon-192.png?v=5">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="הטיולים שלנו">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#C8102E;
    --red-dark:#8A0E22;
    --red-soft:#FBEAEC;
    --gold:#C89B3C;
    --gold-dark:#8f6d24;
    --gold-soft:#FBF3E1;
    --ink:#2B2320;
    --muted:#78706c;
    --line:#EFE1E1;
    --green-bg:#EFF6EC;
    --green-txt:#3d7a3f;
    --shadow-soft:0 4px 16px rgba(43,35,32,.09);
    --shadow-pop:0 6px 20px rgba(43,35,32,.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#FFFAF9;
    color:var(--ink);
    font-family:'Heebo',sans-serif;
    line-height:1.6;
    font-size:15.5px;
    min-height:100vh;
  }
  h1,h2,h3{font-family:'Frank Ruhl Libre',serif;margin:0;}
  header{
    padding:34px 22px 26px;
    background:
      radial-gradient(circle at 92% -10%, rgba(200,16,46,.10), transparent 55%),
      radial-gradient(circle at 6% 120%, rgba(200,155,60,.14), transparent 50%),
      linear-gradient(180deg,#fff,#FFFAF9);
    border-bottom:3px solid var(--red);
  }
  header .eyebrow{color:var(--red);font-size:14px;font-weight:700;margin-bottom:4px;}
  header h1{font-size:32px;color:var(--red-dark);font-weight:700;}
  header .sub{color:var(--muted);font-size:14.5px;margin-top:6px;}
  main{max-width:720px;margin:0 auto;padding:22px 16px 48px;}
  .section{margin-bottom:28px;}
  .section h2{
    font-size:21px;color:var(--red-dark);font-weight:700;
    display:flex;align-items:center;gap:8px;margin-bottom:12px;
  }
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
  .trip{
    display:block;text-decoration:none;color:inherit;
    background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;
    box-shadow:var(--shadow-soft);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .trip:hover{box-shadow:var(--shadow-pop);}
  .trip:active{transform:scale(.98);}
  .trip .cover{
    position:relative;aspect-ratio:1200/630;background:var(--red-soft) center/cover no-repeat;
  }
  .trip .badge{
    position:absolute;top:12px;right:12px;
    font-size:12.5px;font-weight:700;padding:4px 12px;border-radius:999px;
    background:rgba(255,255,255,.94);color:var(--red-dark);
  }
  .trip .badge.live{background:var(--red);color:#fff;}
  .trip .badge.past{color:var(--gold-dark);}
  .trip .body{padding:14px 16px 16px;}
  .trip h3{font-size:22px;color:var(--ink);font-weight:700;}
  .trip .meta{color:var(--muted);font-size:14px;margin-top:4px;}
  .trip .go{
    margin-top:12px;display:inline-flex;align-items:center;gap:6px;
    font-size:14px;font-weight:700;color:var(--red);
  }
  .empty{
    border:1.5px dashed var(--line);border-radius:20px;padding:18px;
    color:var(--muted);font-size:14.5px;text-align:center;background:#fff;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">משפחת רוזנבלום</div>
  <h1>✈️ הטיולים שלנו</h1>
  <div class="sub">הטיול הבא, וכל הטיולים שכבר עשינו — במקום אחד.</div>
</header>

<main id="app"></main>


<script>
/* ===== רשימת הטיולים =====
   כל טיול = תיקייה בריפו (folder) עם האתר המלא שלו.
   start / end בפורמט YYYY-MM-DD קובעים לבד אם הטיול "קרוב", "עכשיו" או בארכיון.
   cover = תמונת השער של הכרטיס (נתיב יחסי לשורש הריפו). */
const TRIPS = [
  {
    folder: "austria-2026",
    title: "אוסטריה 2026",
    emoji: "🏔️",
    start: "2026-09-24",
    end:   "2026-10-03",
    place: "זלצבורגרלנד",
    people: "17 נפשות · 5 משפחות",
    cover: "og-image.png"
  }
];

const HE_MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];

function parseDay(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function today(){ const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function daysBetween(a,b){ return Math.round((b - a) / 86400000); }

function dateRange(t){
  const a = parseDay(t.start), b = parseDay(t.end);
  if (a.getMonth() === b.getMonth())
    return `${a.getDate()}–${b.getDate()} ב${HE_MONTHS[b.getMonth()]} ${b.getFullYear()}`;
  return `${a.getDate()}.${a.getMonth()+1} – ${b.getDate()}.${b.getMonth()+1}.${b.getFullYear()}`;
}

function status(t){
  const now = today(), a = parseDay(t.start), b = parseDay(t.end);
  if (now < a){
    const n = daysBetween(now, a);
    return { kind:"upcoming", label: n === 1 ? "מחר!" : `בעוד ${n} ימים` };
  }
  if (now <= b){
    return { kind:"live", label: `עכשיו בטיול · יום ${daysBetween(a, now) + 1}` };
  }
  return { kind:"past", label: "ארכיון" };
}

function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function card(t){
  const st = status(t);
  const badgeClass = st.kind === "live" ? "badge live" : st.kind === "past" ? "badge past" : "badge";
  const meta = [dateRange(t), t.place, t.people].filter(Boolean).map(esc).join(" · ");
  return `
    <a class="trip" href="${esc(t.folder)}/">
      <div class="cover" style="background-image:url('${esc(t.cover)}')">
        <span class="${badgeClass}">${esc(st.label)}</span>
      </div>
      <div class="body">
        <h3>${esc(t.emoji)} ${esc(t.title)}</h3>
        <div class="meta">${meta}</div>
        <span class="go">${st.kind === "past" ? "לצפייה בטיול" : "לאתר הטיול"} ←</span>
      </div>
    </a>`;
}

function render(){
  const active = TRIPS.filter(t => status(t).kind !== "past")
                      .sort((x,y) => parseDay(x.start) - parseDay(y.start));
  const past   = TRIPS.filter(t => status(t).kind === "past")
                      .sort((x,y) => parseDay(y.start) - parseDay(x.start));
  let html = "";
  if (active.length){
    const live = active.some(t => status(t).kind === "live");
    html += `<section class="section"><h2>${live ? "🧭 עכשיו בטיול" : "🗓️ הטיול הבא"}</h2>
             <div class="grid">${active.map(card).join("")}</div></section>`;
  }
  if (past.length){
    html += `<section class="section"><h2>📚 ארכיון הטיולים</h2>
             <div class="grid">${past.map(card).join("")}</div></section>`;
  }
  if (!TRIPS.length){
    html = `<div class="empty">עוד אין טיולים ברשימה.</div>`;
  }
  document.getElementById("app").innerHTML = html;
}
render();

/* ===== אופליין + עדכון אוטומטי, כמו באתר של אוסטריה ===== */
if ("serviceWorker" in navigator){
  let hadController = !!navigator.serviceWorker.controller;
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((reg) => {
      reg.update().catch(()=>{});
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") reg.update().catch(()=>{});
      });
    }).catch(()=>{});
  });
  let swRefreshed = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController){ hadController = true; return; }
    if (swRefreshed) return;
    swRefreshed = true;
    window.location.reload();
  });
}
</script>
</body>
</html>
