<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אוסטריה למשפחה 2026 — המסלול שלנו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#1F5C4E;
    --green-dark:#163F35;
    --orange:#B5651D;
    --cream:#FAF6EE;
    --cream-2:#F2E9DC;
    --ink:#26302C;
    --muted:#6b7570;
    --line:#DDD3C0;
    --red-bg:#FBEBE7;
    --green-bg:#E9F3EE;
    --yellow-bg:#FDF6E3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Heebo',sans-serif;
    font-weight:400;
    line-height:1.55;
  }
  h1,h2,h3{font-family:'Frank Ruhl Libre',serif;margin:0;}
  header.top{
    padding:22px 28px 18px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#fff, var(--cream));
  }
  header.top .eyebrow{color:var(--orange);font-size:14px;font-weight:500;margin-bottom:4px;}
  header.top h1{font-size:30px;color:var(--green-dark);font-weight:700;}
  header.top .sub{color:var(--muted);font-size:14.5px;margin-top:6px;}

  .layout{
    display:flex;
    align-items:flex-start;
    max-width:1280px;
    margin:0 auto;
    padding:22px 28px 60px;
    gap:26px;
  }
  nav.daynav{
    flex:0 0 210px;
    position:sticky;
    top:18px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  nav.daynav button{
    all:unset;
    cursor:pointer;
    padding:11px 14px;
    border-radius:10px;
    font-size:14.5px;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    gap:2px;
    border-right:3px solid transparent;
    transition:background .15s ease, border-color .15s ease;
  }
  nav.daynav button .d{font-weight:700;color:var(--green-dark);font-size:14px;}
  nav.daynav button .t{color:var(--muted);font-size:12.5px;}
  nav.daynav button:hover{background:#F0EADB;}
  nav.daynav button.active{background:var(--green);border-right-color:var(--orange);}
  nav.daynav button.active .d,nav.daynav button.active .t{color:#fff;}

  main.content{flex:1;min-width:0;}

  .mapCard{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px 10px;
    margin-bottom:20px;
  }
  .mapCard .mapTitle{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:6px;
  }
  .mapCard .mapTitle h2{font-size:17px;color:var(--green-dark);}
  .mapCard .mapTitle span{font-size:12.5px;color:var(--muted);}
  #mapSvg{width:100%;height:auto;display:block;}
  .legend{display:flex;gap:18px;justify-content:center;margin-top:4px;font-size:12px;color:var(--muted);}
  .legend .sw{display:inline-flex;align-items:center;gap:6px;}
  .legend .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}

  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px 26px 26px;}
  .panel .tag{color:var(--orange);font-weight:700;font-size:14.5px;margin-bottom:4px;}
  .panel h2.title{font-size:26px;color:var(--green-dark);margin-bottom:6px;}
  .panel .meta{color:var(--muted);font-size:13.5px;margin-bottom:16px;}

  table.sched{width:100%;border-collapse:collapse;margin-bottom:18px;font-size:14.5px;}
  table.sched td{padding:9px 12px;border-bottom:1px solid #EFE8DA;}
  table.sched td:last-child{width:120px;font-weight:700;background:var(--cream-2);text-align:center;border-radius:6px;}
  table.sched tr:last-child td{border-bottom:none;}

  .sectionLabel{font-family:'Frank Ruhl Libre',serif;font-weight:700;color:var(--green-dark);font-size:16.5px;margin:18px 0 8px;}

  .places{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
  .places .p{font-size:14px;line-height:1.6;}
  .places .p b{color:var(--orange);}

  .boxes{display:flex;gap:14px;margin:16px 0;flex-wrap:wrap;}
  .box{flex:1 1 220px;border-radius:10px;padding:14px 16px;font-size:14px;}
  .box b{display:block;margin-bottom:4px;font-size:14px;}
  .box.green{background:var(--green-bg);}
  .box.red{background:var(--red-bg);}
  .box.yellow{background:var(--yellow-bg);}
  .box.tan{background:var(--cream-2);}

  table.kids{width:100%;border-collapse:collapse;font-size:13.8px;margin-bottom:6px;}
  table.kids td{padding:8px 10px;border-bottom:1px solid #EFE8DA;vertical-align:top;}
  table.kids td:last-child{width:150px;background:var(--cream-2);border-radius:6px;font-size:12.8px;color:var(--muted);}

  .footerbar{background:var(--green-dark);color:#fff;padding:12px 16px;border-radius:10px;font-size:14px;font-weight:500;margin-top:16px;}

  ul.altlist{padding-inline-start:20px;margin:0 0 16px;font-size:14.3px;line-height:1.7;}
  ol.checklist{padding-inline-start:20px;margin:0 0 16px;font-size:14.3px;line-height:1.75;}

  @media (max-width: 860px){
    .layout{flex-direction:column;}
    nav.daynav{
      position:static;
      flex-direction:row;
      overflow-x:auto;
      width:100%;
      flex:none;
      gap:6px;
      padding-bottom:6px;
    }
    nav.daynav button{flex:0 0 auto;white-space:nowrap;border-right:none;border-bottom:3px solid transparent;}
    nav.daynav button.active{border-bottom-color:var(--orange);}
    .boxes{flex-direction:column;}
  }
</style>
</head>

</div>

    <div class="footerbar">סיום נעים ובטוח של הטיול.</div>
  `
},
{

  segment: [],
  render: () => `

/* ---------- Map rendering ---------- */
const svgNS = "http://www.w3.org/2000/svg";
const mapSvg = document.getElementById("mapSvg");
const VBW = 860, VBH = 520, PAD = 78;
const LAT0 = 47.7;
const cosLat0 = Math.cos(LAT0 * Math.PI / 180);

function project(lat, lon){ return { x: lon * cosLat0, y: -lat }; }

const projected = {};
let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
for (const k in LOC){
  const p = project(LOC[k].lat, LOC[k].lon);
  projected[k] = p;
  minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x);
  minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y);
}
const scale = Math.min((VBW-2*PAD)/(maxX-minX), (VBH-2*PAD)/(maxY-minY));
function toPx(k){
  const p = projected[k];
  return {
    x: PAD + (p.x - minX) * scale,
    y: PAD + (p.y - minY) * scale,
  };
}
const px = {}; for (const k in LOC) px[k] = toPx(k);

function pathD(keys){
  return keys.map((k,i)=> (i===0?"M":"L") + px[k].x.toFixed(1) + "," + px[k].y.toFixed(1)).join(" ");
}

function buildMap(){
  mapSvg.setAttribute("viewBox", `0 0 ${VBW} ${VBH}`);
  mapSvg.setAttribute("direction","ltr");
  mapSvg.innerHTML = "";

  // full route (background, muted)
  const bg = document.createElementNS(svgNS,"path");
  bg.setAttribute("d", pathD(FULL_ROUTE));
  bg.setAttribute("fill","none");
  bg.setAttribute("stroke","#cabfa8");
  bg.setAttribute("stroke-width","2");
  bg.setAttribute("stroke-dasharray","5,5");
  mapSvg.appendChild(bg);

  // highlighted segment (drawn later, on top, id="hl-path")
  const hl = document.createElementNS(svgNS,"path");
  hl.setAttribute("id","hl-path");
  hl.setAttribute("fill","none");
  hl.setAttribute("stroke","#B5651D");
  hl.setAttribute("stroke-width","3.4");
  mapSvg.appendChild(hl);

// base markers (all locations, muted dots + small label)
const LABEL_OFFSET = {
  airport:    [-14, -16],
  vienna:     [14, 22],
  wagrain:    [-18, -14],
  hallstatt:  [14, -6],
  gosausee:   [-12, -18],
  alpendorf:  [12, 26],
  werfen:     [-50, -10],
  werfenweng: [14, -16],
  glockner:   [12, 24],
  salzburg:   [-16, -12],
  zell:       [-16, -16],
  kaprun:     [14, 22],
  melk:       [12, -8],
  durnstein:  [12, 8],
};
for (const k in LOC){
    const g = document.createElementNS(svgNS,"g");
    g.setAttribute("data-key",k);
    g.setAttribute("direction","ltr");
    const isBase = k === "wagrain";
    const c = document.createElementNS(svgNS, isBase ? "path" : "circle");
    if (isBase){
      c.setAttribute("d", starPath(px[k].x, px[k].y, 9, 4));
      c.setAttribute("fill", "#1F5C4E");
    } else {
      c.setAttribute("cx", px[k].x); c.setAttribute("cy", px[k].y);
      c.setAttribute("r", 5);
      c.setAttribute("fill", "#cabfa8");
    }
    c.setAttribute("stroke","#fff");
    c.setAttribute("stroke-width","1.2");
    c.setAttribute("class","marker-dot");
    const titleEl = document.createElementNS(svgNS,"title");
    titleEl.textContent = LOC[k].label;
    c.appendChild(titleEl);
    g.appendChild(c);

    const [dx, dy] = LABEL_OFFSET[k] || [8,4];
    const t = document.createElementNS(svgNS,"text");
    t.setAttribute("x", px[k].x + dx);
    t.setAttribute("y", px[k].y + dy);
    t.setAttribute("direction","ltr");
    t.setAttribute("font-size", isBase ? "12.5" : "11");
    t.setAttribute("font-weight", isBase ? "700" : "500");
    t.setAttribute("fill", isBase ? "#1F5C4E" : "#9a9184");
    t.setAttribute("text-anchor", dx < 0 ? "end" : "start");
    t.setAttribute("class","marker-label");
    t.textContent = LOC[k].label;
    g.appendChild(t);

    mapSvg.appendChild(g);
}
}

function starPath(cx, cy, rOuter, rInner){
  let d = "";
  for (let i=0;i<10;i++){
    const r = i%2===0 ? rOuter : rInner;
    const ang = -Math.PI/2 + i * Math.PI/5;
    const x = cx + r*Math.cos(ang);
    const y = cy + r*Math.sin(ang);
    d += (i===0?"M":"L") + x.toFixed(1) + "," + y.toFixed(1) + " ";
  }
  return d + "Z";
}

function updateMap(segment, showAllLabels){
  const hl = document.getElementById("hl-path");
  hl.setAttribute("d", segment.length>1 ? pathD(segment) : "");

  const activeSet = new Set(segment);
  mapSvg.querySelectorAll("g[data-key]").forEach(g=>{
    const key = g.getAttribute("data-key");
    const dot = g.querySelector(".marker-dot");
    const label = g.querySelector(".marker-label");
    const isBase = key === "wagrain";
    const active = activeSet.has(key);
    if (isBase){
      dot.setAttribute("fill","#1F5C4E");
      label.setAttribute("fill","#1F5C4E");
      label.setAttribute("font-size", active ? "13.5" : "12.5");
      label.style.display = "";
    } else if (active){
      dot.setAttribute("r", 7);
      dot.setAttribute("fill","#B5651D");
      label.setAttribute("fill","#8a4415");
      label.setAttribute("font-size","12.5");
      label.setAttribute("font-weight","700");
      label.style.display = "";
    } else {
      dot.setAttribute("r", 5);
      dot.setAttribute("fill","#cabfa8");
      label.setAttribute("fill","#b7ad9c");
      label.setAttribute("font-size","11");
      label.setAttribute("font-weight","500");
      label.style.display = showAllLabels ? "" : "none";
    }
  });
}

/* ---------- Nav + panel rendering ---------- */
const navEl = document.getElementById("daynav");
const panelEl = document.getElementById("panel");
const mapTitleEl = document.getElementById("mapTitle");

DAYS.forEach((d,i)=>{
  const btn = document.createElement("button");
  btn.id = "nav-"+d.id;
  btn.innerHTML = `<span class="d">${d.nav}</span><span class="t">${d.navSub}</span>`;
  btn.addEventListener("click", ()=> selectDay(d.id));
  navEl.appendChild(btn);
});

function selectDay(id){
  const day = DAYS.find(d=>d.id===id);
  if(!day) return;
  panelEl.innerHTML = day.render();
  document.querySelectorAll("nav.daynav button").forEach(b=>b.classList.remove("active"));
  document.getElementById("nav-"+id).classList.add("active");
  const showAll = (id === "overview" || id === "alt");
  updateMap(day.segment.length ? day.segment : FULL_ROUTE, showAll);
  mapTitleEl.textContent = showAll ? "מפת המסלול המלא" : "מפת המסלול — " + day.nav;
  window.scrollTo({top:0, behavior:"smooth"});
}

buildMap();
selectDay("overview");
</script>
